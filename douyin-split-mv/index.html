<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>技能柜 · 开口之前</title>
  <style>
    @font-face {
      font-family: "Noto SC";
      src: url("/fonts/NotoSansSC-VF.ttf") format("truetype");
      font-weight: 100 900;
    }
    :root {
      --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
      --orange: #ff6a12;
      --blue: #2b6bff;
      --cab: #d9d4c8;
      --ink: #1a1916;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 1080px; height: 1920px; overflow: hidden;
      background: #070707;
      font-family: "Noto SC", "Microsoft YaHei", sans-serif;
    }
    .stage { width: 1080px; height: 1920px; position: relative; background: #070707; }

    .pills {
      position: absolute; top: 16px; left: 24px; right: 24px;
      display: flex; gap: 10px; align-items: center; z-index: 40;
    }
    .pill {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 16px; border-radius: 999px;
      color: #fff; font-weight: 800; font-size: 26px;
    }
    .pill.o { background: var(--orange); }
    .pill.b { background: var(--blue); }
    .pill i { width: 12px; height: 12px; border-radius: 50%; background: #fff; display: block; }
    .pills em { margin-left: auto; color: #ece8df; font-style: normal; font-weight: 700; font-size: 22px; opacity: .8; }

    .pane {
      position: absolute; left: 28px; right: 28px;
      border-radius: 28px; overflow: hidden;
      box-shadow: 0 18px 40px rgba(0,0,0,.45);
    }
    .pane.top { top: 88px; height: 820px; background: #1a1a1a; }
    .pane.bot { top: 928px; height: 820px; background: var(--cab); }

    .hd {
      height: 72px; display: flex; align-items: center; gap: 12px;
      padding: 0 22px; font-weight: 800; font-size: 28px;
    }
    .pane.top .hd { background: #111; color: #f4f4f4; border-bottom: 1px solid #2a2a2a; }
    .pane.bot .hd { background: #cfcabf; color: var(--ink); }
    .hd small { font-size: 20px; font-weight: 650; opacity: .55; margin-left: 8px; }

    .feed {
      position: absolute; left: 0; right: 0; top: 72px; bottom: 0;
      padding: 22px 22px 28px; overflow: hidden;
    }

    .msg {
      width: max-content;
      max-width: 78%;
      padding: 16px 18px;
      border-radius: 18px;
      font-size: 28px; font-weight: 650; line-height: 1.35;
      margin-bottom: 14px;
      opacity: 0;
      transform: translateY(16px) scale(0.97);
    }
    .msg.on {
      opacity: 1; transform: none;
      transition: opacity 180ms var(--ease-out), transform 280ms var(--ease-out);
    }
    .msg.user { margin-left: auto; }
    .pane.top .msg.user { background: #3a3a3a; color: #fff; }
    .pane.top .msg.ai { background: #252525; color: #eee; }
    .pane.bot .msg.user { background: #1f6b4a; color: #fff; }
    .pane.bot .msg.ai { background: #fff; color: var(--ink); box-shadow: 0 1px 0 rgba(0,0,0,.06); }

    .tool {
      display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0 16px;
    }
    .tag {
      padding: 8px 14px; border-radius: 999px;
      font-size: 22px; font-weight: 750;
      opacity: 0; transform: translateY(10px);
    }
    .tag.on { opacity: 1; transform: none; transition: opacity 160ms ease, transform 220ms var(--ease-out); }
    .pane.top .tag { background: #3b2418; color: #ffb089; }
    .pane.bot .tag { background: #14331c; color: #b6ffcf; }
    .pane.bot .tag.off { background: #3a1a12; color: #ff9a78; }

    .card {
      background: #fff; border-radius: 16px; padding: 16px 18px; margin-top: 8px;
      font-size: 26px; font-weight: 750; color: var(--ink);
      opacity: 0; transform: translateY(12px) scale(0.97);
    }
    .card.on { opacity: 1; transform: none; transition: opacity 180ms ease, transform 280ms var(--ease-out); }
    .card b { display: block; font-size: 40px; letter-spacing: -.04em; margin-top: 4px; }
    .card.bad { background: #2a1612; color: #ffb3a0; }
    .card.good { background: #102418; color: #b7ffd1; }

    .lyric {
      position: absolute; left: 40px; right: 40px; z-index: 30;
      pointer-events: none; text-align: left;
      font-weight: 900; letter-spacing: -0.07em; line-height: .9;
      opacity: 0; transform: translateY(24px) scale(0.94);
    }
    .lyric.on {
      opacity: 1; transform: none;
      transition: opacity 140ms var(--ease-out), transform 320ms var(--ease-out);
    }
    .lyric.off { opacity: 0; transform: translateY(-12px); transition: opacity 120ms ease, transform 160ms ease; }
    .lyric.a { top: 640px; font-size: 132px; color: #fff;
      text-shadow: 0 8px 0 #000, 0 18px 28px rgba(0,0,0,.55); }
    .lyric.b { top: 1480px; font-size: 132px; color: #111;
      text-shadow: 0 8px 0 rgba(255,255,255,.75); }

    .comments {
      position: absolute; right: 44px; top: 780px; width: 400px; z-index: 35;
      display: flex; flex-direction: column; gap: 10px;
    }
    .cmt {
      background: rgba(12,12,12,.86); color: #fff;
      border-radius: 16px; padding: 12px 16px;
      font-size: 24px; font-weight: 700;
      opacity: 0; transform: translateX(20px);
    }
    .cmt.on { opacity: 1; transform: none; transition: opacity 200ms ease, transform 280ms var(--ease-out); }
    .cmt span { color: #ffd36a; }

    .ai { position: absolute; left: 28px; bottom: 86px; color: #bbb; font-size: 20px; font-weight: 700; z-index: 36; }
    .wave {
      position: absolute; left: 0; right: 0; bottom: 0; height: 70px;
      background: #000; display: flex; align-items: flex-end; justify-content: center;
      gap: 4px; padding-bottom: 12px; z-index: 37;
    }
    .bar { width: 6px; height: 8px; background: #fff; border-radius: 2px; }

    .end {
      position: absolute; inset: 0; background: #070707; z-index: 50;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      opacity: 0; pointer-events: none; color: #f3eee4;
    }
    .end.on { opacity: 1; transition: opacity 360ms ease; pointer-events: auto; }
    .end h1 { font-size: 112px; line-height: .95; letter-spacing: -.06em; text-align: center; font-weight: 900; }
    .end p { margin-top: 18px; font-size: 32px; color: #b7b1a6; font-weight: 650; }
  </style>
</head>
<body>
  <div class="stage">
    <div class="pills">
      <div class="pill o"><i></i>模型自己翻柜</div>
      <div class="pill b"><i></i>jev-decision</div>
      <em>同一句话 · 谁先开口</em>
    </div>

    <section class="pane top">
      <div class="hd">Chat · 自己翻 <small>先说话再找技能</small></div>
      <div class="feed" id="feedA"></div>
    </section>
    <section class="pane bot">
      <div class="hd">技能柜 · jev-decision <small>开口之前</small></div>
      <div class="feed" id="feedB"></div>
    </section>

    <div class="lyric a" id="lyA"></div>
    <div class="lyric b" id="lyB"></div>

    <div class="comments">
      <div class="cmt" data-at="7">上面在翻 Word，下面已经关门</div>
      <div class="cmt" data-at="15">点了名才留下 · 没点名关掉</div>
      <div class="cmt" data-at="23">旧路由 <span>15/33</span> · 现在 <span>33/33</span></div>
      <div class="cmt" data-at="31">插件挂开口前，MCP 不许改选</div>
    </div>
    <div class="ai">内容由 AI 生成</div>
    <div class="wave" id="wave"></div>
    <div class="end" id="end">
      <h1>本机先选<br>再让模型说话</h1>
      <p>技能柜 · jev-decision · 开口之前</p>
    </div>
  </div>
  <script>
    const feedA = document.getElementById("feedA");
    const feedB = document.getElementById("feedB");
    const lyA = document.getElementById("lyA");
    const lyB = document.getElementById("lyB");
    const end = document.getElementById("end");
    const wave = document.getElementById("wave");
    for (let i = 0; i < 72; i++) {
      const b = document.createElement("div");
      b.className = "bar";
      wave.appendChild(b);
    }
    const bars = [...wave.children];

    const scenes = [
      {
        t: 0.2,
        la: "现在几点", lb: "自己做",
        a: `<div class="msg user on">现在几点了</div>
            <div class="msg ai on">我来帮你查时间和天气，文档也一起打开。</div>
            <div class="tool"><span class="tag on">调用 天气</span><span class="tag on">打开 Word</span><span class="tag on">翻日历</span><span class="tag on">搜浏览器</span></div>`,
        b: `<div class="msg user on">现在几点了</div>
            <div class="card good on">jev-decision<b>自己做 · 不调用</b></div>
            <div class="tool"><span class="tag off on">天气 关掉</span><span class="tag off on">Word 关掉</span></div>`
      },
      {
        t: 8.8,
        la: "全柜翻开", lb: "留下",
        a: `<div class="msg user on">把这次会议整理成纪要</div>
            <div class="msg ai on">226 个技能我先都看一眼。</div>
            <div class="tool"><span class="tag on">纪要</span><span class="tag on">周报</span><span class="tag on">邮件</span><span class="tag on">PPT</span><span class="tag on">路由</span></div>`,
        b: `<div class="msg user on">把这次会议整理成纪要</div>
            <div class="card good on">点了名留下<b>会议纪要</b></div>
            <div class="tool"><span class="tag on">会议纪要</span><span class="tag off on">周报 关掉</span><span class="tag off on">PPT 关掉</span></div>`
      },
      {
        t: 16.8,
        la: "15 / 33", lb: "33 / 33",
        a: `<div class="msg user on">同一套评估句</div>
            <div class="card bad on">Laya 旧路由<b>15 / 33 过</b></div>
            <div class="msg ai on">选错门，测不过。</div>`,
        b: `<div class="msg user on">同一套评估句</div>
            <div class="card good on">jev-decision<b>33 / 33 过</b></div>
            <div class="tool"><span class="tag on">点了名留下</span><span class="tag off on">没点名关掉</span></div>`
      },
      {
        t: 25.2,
        la: "晚了", lb: "先选",
        a: `<div class="msg user on">把插件和 MCP 都挂上</div>
            <div class="msg ai on">我聊完再挂插件。MCP 我也能改选。</div>
            <div class="card bad on">开口之后才动手<b>已经晚了</b></div>`,
        b: `<div class="msg user on">把插件和 MCP 都挂上</div>
            <div class="card good on">Harness 挂开口前<b>本机先选</b></div>
            <div class="msg ai on">MCP 只登记，不许改选。</div>`
      }
    ];

    function slap(box, text) {
      box.classList.remove("on");
      box.classList.add("off");
      requestAnimationFrame(() => {
        box.textContent = text;
        box.classList.remove("off");
        void box.offsetWidth;
        box.classList.add("on");
      });
    }

    let idx = -1;
    const OFFSET = Number(new URLSearchParams(location.search).get("t") || 0);
    const t0 = performance.now() - OFFSET * 1000;

    function apply(i) {
      const s = scenes[i];
      feedA.innerHTML = s.a;
      feedB.innerHTML = s.b;
      slap(lyA, s.la);
      slap(lyB, s.lb);
    }

    function tick(now) {
      const t = (now - t0) / 1000;
      let next = idx;
      scenes.forEach((s, i) => { if (t >= s.t) next = i; });
      if (next !== idx && next >= 0) {
        idx = next;
        apply(idx);
      }
      document.querySelectorAll(".cmt").forEach((c) => {
        if (t >= Number(c.dataset.at)) c.classList.add("on");
      });
      if (t >= 38.2) end.classList.add("on");
      const beat = 0.45 + 0.55 * Math.abs(Math.sin(t * Math.PI * 3.6));
      bars.forEach((b, i) => {
        b.style.height = (8 + 46 * beat * (0.3 + 0.7 * Math.abs(Math.sin(t * 9 + i * 0.35)))) + "px";
      });
      if (t < 44) requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  </script>
</body>
</html>

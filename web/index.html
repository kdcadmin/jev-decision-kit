document.getElementById("copy-mcp").addEventListener("click", async () => {
  const node = document.getElementById("mcp-config");
  const button = document.getElementById("copy-mcp");
  const text = node.textContent;
  const range = document.createRange();
  range.selectNodeContents(node);
  const selection = window.getSelection();
  selection.removeAllRanges();
  selection.addRange(range);
  try {
    await navigator.clipboard.writeText(text);

  } catch (error) {

  }
});

  if (event.key !== "Escape") return;
  closeSyncCard();
  document.getElementById("add-card").hidden = true;
  document.getElementById("mcp-card").hidden = true;
});

function syncStatus(report) {
  const names = (report.updated || []).map((item) => item.name).slice(0, 8).join("、");
  const verb = report.direction === "push" ? "旧文件已改成和现在一样" : "已撤销，与旧文件一致";
  if (!(report.updated || []).length) return `已经一致。未改动 ${report.unchanged} 个，找不到旧文件 ${report.missingCount} 个。`;
  return `${verb}：${report.updated.length} 个${names ? "（" + names + "）" : ""}。未改动 ${report.unchanged} 个，找不到旧文件 ${report.missingCount} 个。`;
}

async function runSync(direction, name) {
  const one = Boolean(name);
  const status = one ? document.getElementById("status") : document.getElementById("settings-status");
  if (!one) {
    status.textContent = "正在对比全部技能…";
    const preview = await api("/api/sync", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ direction, name: "", preview: true })
    });
    const differ = (preview.updated || []).length;
    if (!differ) {
      status.textContent = `已经一致。未改动 ${preview.unchanged} 个，找不到旧文件 ${preview.missingCount} 个。`;
      return;
    }
    const action = direction === "push" ? "把旧文件改成和现在一样" : "撤销这些修改，让现在的文件回到旧文件";
    const ok = window.confirm(`柜里 ${state.skills.length} 个技能，有 ${differ} 个和旧文件不一样。\n确定${action}？找不到旧文件的会跳过。`);
    if (!ok) {
      status.textContent = "已取消。";
      return;
    }
  }
  status.textContent = direction === "push" ? "正在把旧文件改成和现在一样…" : "正在撤销，使现文件与旧文件一致…";
  if (direction === "push" && state.dirty && state.current && document.getElementById("editor") && (!name || name === state.current.name)) {
    const content = document.getElementById("editor").value;
    await api("/api/save", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ name: state.current.name, content }) });
    state.current.content = content;
    state.dirty = false;
  }
  if (direction === "revert") state.dirty = false;
  const report = await api("/api/sync", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ direction, name: name || "" })
  });
  if (one) {
    await openSkill(name);
    const line = document.getElementById("status");
    if (line) line.textContent = syncStatus(report);
    return;
  }
  const catalog = await api("/api/catalog");
  applyCatalog(catalog, status, null);
  if (state.current) await openSkill(state.current.name);
  const settingsLine = document.getElementById("settings-status");
  if (settingsLine) settingsLine.textContent = syncStatus(report);
}

async function readToolMemory() {
  if (state.memoryJob && state.memoryJob.state === "running") return;
  const job = await api("/api/memory/tools", { method: "POST", headers: { "Content-Type": "application/json" }, body: "{}" });
  const done = await pollJob("memory", job, (current) => {
    state.memoryJob = current;
    paintTrack("settings", current);
  });
  state.memoryJob = done;
}

async function scanSkills() {
  if (state.scanJob && state.scanJob.state === "running") return;
  const job = await api("/api/scan", { method: "POST", headers: { "Content-Type": "application/json" }, body: "{}" });
  const done = await pollJob("scan", job, (current) => {
    state.scanJob = current;
    paintTrack("settings", current);
  });
  state.scanJob = done;
  if (done && done.state === "done") {
    const catalog = await api("/api/catalog");
    applyCatalog(catalog, document.getElementById("settings-status"), null);
    const line = document.getElementById("settings-status");
    if (line) line.textContent = done.message || done.label;
  }
}

function visibleLibrary() {
  if (state.libSearch) return state.libSearch;
  const feed = state.libraryFeed || { items: [], note: "", fetchedAt: "", days: [] };
  if (!state.libDay) return feed;
  const day = (feed.days || []).find((item) => item.date === state.libDay);
  if (!day) return feed;
  return { items: day.items || [], note: feed.note, fetchedAt: day.fetchedAt, date: day.date, days: feed.days };
}

function freshRepoNames(items) {
  const days = (state.libraryFeed && state.libraryFeed.days) || [];
  const latest = days[0] && days[0].date;
  if (state.libSearch || (state.libDay && state.libDay !== latest) || days.length < 2) return new Set();
  const previous = new Set((days[1].items || []).map((item) => item.fullName || item.url));
  return new Set(items.filter((item) => !previous.has(item.fullName || item.url)).map((item) => item.fullName || item.url));
}

function formatStars(value) {
  const count = Number(value) || 0;
  if (count >= 10000) {
    const wan = count / 10000;
    return (wan >= 10 ? Math.round(wan) : wan.toFixed(1).replace(/\.0$/, "")) + " 万星";
  }
  return count + " 星";
}

function renderLibrary() {
  const view = document.getElementById("library-view");
  const feed = visibleLibrary();
  const fresh = freshRepoNames(feed.items || []);
  const cards = (feed.items || []).map((item, index) => `
    <article class="lib-card" data-repo="${index}">
      <a href="${esc(item.url)}" target="_blank" rel="noreferrer"><strong>${esc(item.fullName || item.name)}</strong></a>
      <em>${fresh.has(item.fullName || item.url) ? "新上榜 · " : ""}${esc(formatStars(item.stars))}</em>
      <p>${esc(item.description || "没有简介")}</p>
    </article>`).join("") || `<p class="note">${state.libSearch ? "没有搜到。" : "今天还没有推荐。"}</p>`;
  const days = (state.libraryFeed && state.libraryFeed.days) || [];
  const latestDay = days[0] && days[0].date;
  const dayButtons = days.map((day) => `<button class="lib-day${day.date === (state.libDay || latestDay) ? " on" : ""}" type="button" data-day="${esc(day.date)}">${esc(day.date)}</button>`).join("");
  const history = state.libHistoryOpen && !state.libSearch
    ? `<div class="lib-days">${dayButtons || `<span class="note">还没有留下推荐。</span>`}</div>`
    : "";
  const directories = ((state.libraryFeed && state.libraryFeed.directories) || []).map((item) =>
    `<a href="${esc(item.url)}" target="_blank" rel="noreferrer"><strong>${esc(item.name)}</strong><span>${esc(item.note || item.url)}</span></a>`
  ).join("");
  const heading = state.libSearch ? "搜索结果" : (state.libDay && state.libDay !== latestDay ? `${state.libDay} 的推荐` : "今日推荐");
  view.classList.toggle("picked", !!(state.libPick && state.libPick.kind === "repo"));
  view.innerHTML = `
    <div class="lib-center">
      <div class="lib-head">
        <h2>${esc(heading)}</h2>
        ${state.libSearch ? "" : `<button id="lib-history" type="button">${state.libHistoryOpen ? "收起历史" : "历史推荐"}</button>`}
        <form id="lib-search" class="lib-install">
          <input id="lib-query" type="text" placeholder="搜网上的仓库" value="${esc(state.libQuery || "")}">
          <button type="submit">搜索</button>
          ${state.libSearch ? `<button id="lib-clear" type="button">回到推荐</button>` : ""}
        </form>
        <form id="lib-install" class="lib-install">
          <input id="github-url" type="text" placeholder="GitHub 链接" value="${esc(state.githubDraft || "")}">
          <button type="submit">安装</button>
          <button id="lib-local" type="button">本地文件夹</button>
        </form>
        <button id="refresh-library" type="button">重新获取</button>
      </div>
      <p class="note">${esc(state.libSearch ? (feed.note || "") : "按 GitHub 星标，话题是 agent-skills 的仓库。每天留一份，以前的推荐还能翻。不会自动装进柜。")}${feed.fetchedAt ? " · 更新于\u00a0" + esc(formatWhen(feed.fetchedAt)) : ""}</p>
      ${history}
      <p class="note" id="library-status">${esc(state.installJob ? jobStatusText(state.installJob) : (state.libraryStatus || "点一张卡片，右边是中文介绍。可以装入库，也可以只装其中一个。"))}</p>
      <div class="install-track${state.installJob && state.installJob.state === "failed" ? " failed" : ""}" id="install-track" ${state.installJob && state.installJob.state !== "done" ? "" : "hidden"}><span style="width:${state.installJob && state.installJob.state !== "done" ? Number(state.installJob.progress || 0) : 0}%"></span></div>
      <div class="lib-stage" id="lib-stage">
        <div class="lib-cards">${cards}</div>
        <aside class="lib-detail" id="lib-detail"></aside>
      </div>
      ${state.libSearch ? "" : `<section class="lib-extra"><h3>市面上的 skill 下载链接</h3><div class="dir-list">${directories}</div></section>`}
    </div>`;
  document.getElementById("refresh-library").addEventListener("click", () => refreshLibrary().catch((error) => alert(error.message)));
  document.getElementById("lib-search").addEventListener("submit", (event) => {
    event.preventDefault();
    const input = document.getElementById("lib-query");
    state.libQuery = input.value;
    searchLibrary(input.value).catch((error) => alert(error.message));
  });
  const clearSearch = document.getElementById("lib-clear");
  if (clearSearch) clearSearch.addEventListener("click", () => {
    state.libSearch = null;
    state.libQuery = "";
    state.libPick = null;
    renderLibrary();
  });
  const historyButton = document.getElementById("lib-history");
  if (historyButton) historyButton.addEventListener("click", () => {
    state.libHistoryOpen = !state.libHistoryOpen;
    renderLibrary();
  });
  document.getElementById("lib-local").addEventListener("click", () => installLocal().catch((error) => alert(error.message)));
  document.getElementById("lib-install").addEventListener("submit", (event) => {
    event.preventDefault();
    const input = document.getElementById("github-url");
    state.githubDraft = input.value;
    installGithub(input.value).catch((error) => alert(error.message));
  });
  document.getElementById("github-url").addEventListener("input", (event) => {
    state.githubDraft = event.target.value;
  });
  renderLibDetail();
  markLibrarySelection();
}

function markLibrarySelection() {
  document.querySelectorAll("#library-view .lib-card.on, #library-view .lib-row.on").forEach((item) => item.classList.remove("on"));
  const pick = state.libPick;
  if (!pick) return;
  const url = pick.kind === "repo" ? pick.url : (state.libRepo && state.libRepo.url);
  const index = (visibleLibrary().items || []).findIndex((item) => item.url === url);
  const card = document.querySelector(`#library-view [data-repo="${index}"]`);
  if (card) card.classList.add("on");
}

function closeLibraryPick() {
  const view = document.getElementById("library-view");
  state.libPick = null;
  view.classList.remove("picked");
  markLibrarySelection();
  renderLibDetail();
}

function renderLibDetail() {
  const pane = document.getElementById("lib-detail");
  if (!pane) return;
  const pick = state.libPick;
  if (!pick || pick.kind !== "repo") {
    pane.innerHTML = "";
    return;
  }
  const skills = (pick.skills || []).map((skill, index) => `
    <div class="lib-jump" style="animation-delay:${Math.min(index, 14) * 28}ms">
      <a href="${esc(skill.url)}" target="_blank" rel="noreferrer">${esc(skill.name)}</a>
      <span>
        <a href="${esc(skill.url)}" target="_blank" rel="noreferrer">原链接</a>
        <button type="button" data-install="${esc(skill.url)}">装这个</button>
      </span>
    </div>`).join("");
  const waiting = pick.loading ? `<p class="note">正在读这个项目的介绍…</p>` : "";
  const failed = pick.error ? `<p class="note">${esc(pick.error)}</p>` : "";
  const more = pick.truncated ? `<p class="note">仓库里还有更多，这里先列 ${(pick.skills || []).length} 个。</p>` : "";
  const count = pick.loading ? "" : ` · ${(pick.skills || []).length} 个`;
  const installAll = pick.loading ? "" : `<button class="go-install" type="button" data-install="${esc(pick.url)}">装入库</button>`;
  const about = (pick.about || "").trim();
  const intro = about
    ? about.split(/\n\n+/).map((paragraph) => `<p>${esc(paragraph)}</p>`).join("")
    : `<p>${esc(pick.description || "这个仓库没有项目介绍。")}</p>`;
  pane.innerHTML = `
    <button class="lib-back" id="lib-back" type="button">返回</button>
    <h3>${esc(pick.fullName || pick.name)}</h3>
    <p class="lib-kicker">项目介绍</p>
    <div class="intro">${waiting && !about ? `<p>正在读这个项目的介绍…</p>` : intro}</div>
    <p class="lib-actions"><span>里面的技能${esc(count)}</span>
      <a href="${esc(pick.url)}" target="_blank" rel="noreferrer">仓库原链接</a>
      ${installAll}</p>
    <div class="lib-skills">${failed}${skills}${more}</div>`;
}

async function searchLibrary(query) {
  const text = (query || "").trim();
  if (!text) return;
  const status = document.getElementById("library-status");
  if (status) status.textContent = "正在搜…";
  state.libSearch = await api("/api/library/search", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ q: text })
  });
  state.libPick = null;
  state.libraryStatus = "";
  renderLibrary();
}

async function openRepo(index) {
  const item = (visibleLibrary().items || [])[index];
  if (!item) return;
  const view = document.getElementById("library-view");
  const cached = state.repoCache[item.url];
  state.libPick = {
    kind: "repo",
    ...item,
    skills: cached ? cached.skills || [] : [],
    about: cached ? cached.about || "" : "",
    loading: !cached,
    error: "",
    truncated: cached ? cached.truncated : false
  };
  state.libRepo = state.libPick;
  view.classList.add("picked");
  markLibrarySelection();
  renderLibDetail();
  const picked = document.querySelector("#library-view .lib-card.on");
  if (picked) picked.scrollIntoView({ block: "nearest" });
  if (cached) return;
  try {
    const peeked = state.repoCache[item.url] || await api("/api/library/peek", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ url: item.url })
    });
    state.repoCache[item.url] = peeked;
    state.libPick = { kind: "repo", ...item, skills: peeked.skills || [], about: peeked.about || "", loading: false, truncated: peeked.truncated, error: peeked.error || "" };
    state.libRepo = state.libPick;
  } catch (error) {
    state.libPick = { kind: "repo", ...item, skills: [], loading: false, error: error.message };
    state.libRepo = state.libPick;
  }
  renderLibDetail();
  markLibrarySelection();
}

async function loadLibrary() {
  const view = document.getElementById("library-view");
  view.innerHTML = `<h2>今日推荐</h2><p class="note">正在取今日推荐…</p>`;
  state.libraryFeed = await api("/api/library");
  renderLibrary();
}

document.getElementById("library-view").addEventListener("click", (event) => {
  if (event.target.closest("#lib-back")) {
    closeLibraryPick();
    return;
  }
  const dayButton = event.target.closest("[data-day]");
  if (dayButton) {
    const days = (state.libraryFeed && state.libraryFeed.days) || [];
    const latest = days[0] && days[0].date;
    state.libSearch = null;
    state.libQuery = "";
    state.libPick = null;
    state.libDay = dayButton.dataset.day === latest ? null : dayButton.dataset.day;
    renderLibrary();
    return;
  }
  if (event.target.closest("a")) return;
  const install = event.target.closest("[data-install]");
  if (install) {
    installGithub(install.dataset.install).catch((error) => alert(error.message));
    return;
  }
  const repo = event.target.closest("[data-repo]");
  if (repo) openRepo(Number(repo.dataset.repo)).catch((error) => alert(error.message));
});

async function refreshLibrary() {
  state.libSearch = null;
  state.libQuery = "";
  state.libDay = null;
  const status = document.getElementById("library-status");
  if (status) status.textContent = "正在向 GitHub 取星标前 10…";
  await api("/api/library/refresh", { method: "POST", headers: { "Content-Type": "application/json" }, body: "{}" });
  await loadLibrary();
}

const sourceState = { path: "", after: null, kind: "" };

function openSource(options) {
  sourceState.path = options.path;
  sourceState.after = options.after;
  sourceState.kind = options.kinds[0][0];
  document.getElementById("source-title").textContent = options.title;
  document.getElementById("source-note").textContent = options.note;
  document.getElementById("source-kinds").innerHTML = options.kinds.map(([id, label, placeholder], index) =>
    `<button type="button" data-source-kind="${esc(id)}" data-placeholder="${esc(placeholder)}" class="${index === 0 ? "on" : ""}">${esc(label)}</button>`
  ).join("");
  const input = document.getElementById("source-input");
  input.value = "";
  input.placeholder = options.kinds[0][2];
  document.getElementById("source-pick").hidden = options.kinds[0][0] !== "local";
  document.getElementById("source-card").hidden = false;
  input.focus();
}

document.getElementById("source-kinds").addEventListener("click", (event) => {
  const button = event.target.closest("[data-source-kind]");
  if (!button) return;
  sourceState.kind = button.dataset.sourceKind;
  document.querySelectorAll("#source-kinds button").forEach((item) => item.classList.toggle("on", item === button));
  document.getElementById("source-input").placeholder = button.dataset.placeholder || "";
  document.getElementById("source-pick").hidden = sourceState.kind !== "local";
});

document.getElementById("source-card").addEventListener("click", (event) => {
  if (event.target.id === "source-card") document.getElementById("source-card").hidden = true;
});

document.getElementById("source-pick").addEventListener("click", async () => {
  const picked = await api("/api/pick-folder", { method: "POST", headers: { "Content-Type": "application/json" }, body: "{}" });
  if (!picked.cancelled && picked.path) document.getElementById("source-input").value = picked.path;
});

document.getElementById("source-save").addEventListener("click", async () => {
  try {
    await api(sourceState.path, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ kind: sourceState.kind, source: document.getElementById("source-input").value })
    });
    document.getElementById("source-card").hidden = true;
    if (sourceState.after) await sourceState.after();
  } catch (error) {
    alert(error.message);
  }
});

async function handleBoardClick(event, reload) {
  const toggle = event.target.closest("[data-toggle]");
  const remove = event.target.closest("[data-remove]");
  if (!toggle && !remove) return;
  const item = toggle || remove;
  const kind = item.dataset.toggle || item.dataset.remove;
  const path = kind === "plugin" ? "/api/plugins" : "/api/mcp";
  if (remove) {
    await api(path + "/delete", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ host: item.dataset.host, name: item.dataset.name })
    });
  } else {
    await api(path + "/toggle", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ host: item.dataset.host, name: item.dataset.name, enabled: item.dataset.enabled !== "1" })
    });
  }
  await reload();
}

async function installLocal() {
  const status = document.getElementById("library-status");
  if (status) status.textContent = "选择一个里面有 SKILL.md 的文件夹…";
  const picked = await api("/api/pick-folder", { method: "POST", headers: { "Content-Type": "application/json" }, body: "{}" });
  if (picked.cancelled || !picked.path) {
    if (status) status.textContent = state.libraryStatus || "没有选择文件夹。";
    return;
  }
  if (status) status.textContent = "正在复制本地技能，不运行脚本…";
  const report = await api("/api/library/local", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ path: picked.path })
  });
  const catalog = await api("/api/catalog");
  applyCatalog(catalog, status, null);
  state.libraryStatus = report.message + " " + (report.copied || []).map((item) => item.name).join("、");
  const line = document.getElementById("library-status");
  if (line) line.textContent = state.libraryStatus;
}

function paintInstall(job) {
  state.installJob = job;
  const line = document.getElementById("library-status");
  const track = document.getElementById("install-track");
  const bar = track && track.querySelector("span");
  if (line) line.textContent = jobStatusText(job);
  if (track) {
    track.hidden = !job || job.state === "done";
    track.classList.toggle("failed", !!(job && job.state === "failed"));
  }
  if (bar) bar.style.width = job && job.state === "done" ? "0%" : Math.max(0, Math.min(100, Number((job && job.progress) || 0))) + "%";
}

async function installGithub(url) {
  if (!url || state.installJob && state.installJob.state === "running") return;
  const job = await api("/api/library/install", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ url })
  });
  paintInstall(job);
  while (state.installJob && state.installJob.state === "running") {
    await new Promise((resolve) => setTimeout(resolve, 700));
    const next = await api("/api/library/install?id=" + encodeURIComponent(job.id));
    paintInstall(next);
  }
  if (state.installJob && state.installJob.state === "done") {
    const catalog = await api("/api/catalog");
    applyCatalog(catalog, document.getElementById("library-status"), null);
    const names = (state.installJob.copied || []).map((item) => item.name).filter(Boolean).join("、");
    state.libraryStatus = state.installJob.message + (names ? " " + names : "");
    const line = document.getElementById("library-status");
    if (line) line.textContent = state.libraryStatus;
  }
  if (state.installJob && state.installJob.state === "failed") {
    state.libraryStatus = state.installJob.message || state.installJob.label;
  }
}

api("/api/catalog").then((data) => {
  state.categories = data.categories;
  state.skills = data.skills;
  document.getElementById("count").textContent = "jev-decision · " + data.total;
  renderCats();
  renderList();
}).catch((error) => {
  listEl.innerHTML = `<div class="empty">${esc(error.message)}</div>`;
});
</script>

<!DOCTYPE html>
<html lang="zh-CN" data-theme="light" data-view="list">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>技能柜</title>
<!-- 图标：Reicon（MIT · https://reicon.dev · 底图 Solar Icons CC BY 4.0），内联 SVG，不引任何外部请求 -->
<script>
/* 主题与视图先于首屏生效，避免闪一下；默认跟随系统，手动选择记在本机。 */
try {
  var t = localStorage.getItem("kit-theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  document.documentElement.dataset.theme = t;
  document.documentElement.dataset.view = localStorage.getItem("kit-view") || "list";
} catch (e) { document.documentElement.dataset.theme = "light"; }
</script>
<style>
  :root {
    --bg: #e4e1d8;
    --sheet: #f7f6f2;
    --ink: #1c211c;
    --muted: #5c6560;
    --line: #d5d1c7;
    --accent: #0c6b52;
    --accent-ink: #f3faf6;
    --fill: #e7f3ee;
    --warn: #8f3d32;
    --stamp: var(--accent);
    --moss: var(--accent);
    --moss-ink: var(--accent-ink);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    margin: 0;
    color: var(--ink);
    font-family: "Noto Sans SC", "Segoe UI", sans-serif;
    font-size: 14px;
    background: var(--bg);
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  .app {
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    display: grid;
    grid-template-rows: auto auto minmax(0, 1fr);
  }
  header { grid-row: 1; }
  .ticket { grid-row: 2; }
  main { grid-row: 3; }
  header {
    display: grid;
    grid-template-columns: auto minmax(280px, 1fr);
    gap: 28px;
    align-items: end;
    padding: 16px 20px 12px;
  }
  .mark { display: flex; flex-direction: column; gap: 2px; }
  .mark h1 {
    margin: 0;
    font-weight: 700;
    font-size: 22px;
    letter-spacing: 0;
    line-height: 1.1;
  }
  .mark p {
    margin: 2px 0 0;
    color: var(--muted);
    font-size: 12px;
  }
  .route {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    gap: 8px;
    align-items: center;
  }
  .route label {
    display: block;
    margin-bottom: 4px;
    font-size: 12px;
    color: var(--muted);
  }
  .route input {
    width: 100%;
    border: 1px solid var(--line);
    border-radius: 4px;
    background: var(--sheet);
    padding: 8px 10px;
    outline: none;
    font-size: 14px;
  }
  .route input:focus { border-color: var(--accent); }
  .go {
    border: 0;
    border-radius: 4px;
    background: var(--accent);
    color: var(--accent-ink);
    padding: 8px 14px;
  }
  .go:disabled { opacity: 0.45; cursor: wait; }
  .ticket {
    margin: 0 28px 12px;
    min-height: 0;
  }
  .ticket:empty { display: none; }
  .ticket-card, .ticket-error {
    background: var(--sheet);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 12px 14px;
    display: flex;
    gap: 18px;
    align-items: stretch;
    flex-wrap: wrap;
  }
  .ticket-error { color: var(--warn); }
  .ticket-wait { color: var(--muted); }
  .pick-actions { display: flex; gap: 6px; margin-top: 8px; }
  .pick-actions button, .ticket-card > button {
    border: 1px solid var(--ink);
    background: transparent;
    padding: 4px 8px;
    font-size: 13px;
  }
  .changed { color: var(--stamp); font-style: normal; margin-left: 6px; }
  .add-results { display: flex; flex-direction: column; gap: 8px; max-height: 280px; overflow: auto; }
  .add-results button { width: 100%; text-align: left; border: 1px solid var(--ink); background: transparent; padding: 10px 12px; }
  #add-card-query { width: 100%; border: 0; border-bottom: 1.5px solid var(--ink); background: transparent; padding: 6px 0; margin-bottom: 12px; outline: none; }
  .pick {
    min-width: 180px;
    border-left: 3px solid var(--moss);
    padding-left: 10px;
  }
  .pick button {
    display: block;
    width: 100%;
    text-align: left;
    border: 0;
    background: transparent;
    padding: 0;
  }
  .pick .k { font-size: 12px; color: var(--muted); }
  .pick strong { display: block; font-size: 18px; margin-top: 2px; }
  .pick span { color: var(--muted); font-size: 13px; }
  .bars { flex: 1; min-width: 220px; display: grid; gap: 4px; align-content: center; }
  .bar { display: grid; grid-template-columns: 72px 1fr 42px; gap: 8px; align-items: center; font-size: 12px; }
  .bar i { display: block; height: 6px; background: rgba(27,22,18,.08); }
  .bar i b { display: block; height: 100%; background: var(--accent); }
  .passed { margin: 8px 0 0; color: var(--muted); font-size: 13px; }
  main {
    min-height: 0;
    height: 100%;
    overflow: hidden;
    display: grid;
    grid-template-columns: 180px 300px minmax(0, 1fr);
    gap: 10px;
    padding: 0 20px 16px;
  }
  .pane {
    min-height: 0;
    height: 100%;
    overflow: hidden;
    background: var(--sheet);
    border: 1px solid var(--line);
    border-radius: 6px;
    display: flex;
    flex-direction: column;
  }
  .pane h2, .sheet h2, .lib-head h2, .calls-head h2 {
    margin: 0;
    padding: 10px 12px 6px;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0;
  }
  .cats, .list { flex: 1 1 auto; min-height: 0; overflow: auto; padding: 0 8px 10px; }
  .cat, .skill {
    width: 100%;
    display: flex;
    justify-content: space-between;
    gap: 8px;
    border: 0;
    background: transparent;
    text-align: left;
    padding: 8px 8px;
    border-bottom: 1px solid transparent;
  }
  .cat.active, .skill.active { background: var(--fill); box-shadow: inset 3px 0 0 var(--accent); }
  .cat.over { outline: 2px dashed var(--accent); outline-offset: -2px; }
  .cat em, .skill small { font-style: normal; color: var(--muted); font-size: 12px; }
  .cat.active em, .skill.active small { color: var(--muted); }
  .skill { align-items: baseline; }
  .skill b { font-weight: 700; }
  .search, .lib-install input, .settings input[type="text"], .settings input[type="number"], #add-card-query {
    border: 1px solid var(--line);
    border-radius: 4px;
    background: var(--sheet);
    padding: 6px 8px;
    outline: none;
  }
  .search { margin: 0 12px 8px; }
  .search:focus, .lib-install input:focus, .settings input:focus, #add-card-query:focus { border-color: var(--accent); }
  .detail { min-height: 0; display: grid; grid-template-rows: auto auto minmax(0, 1fr) auto; }
  .detail-head, .tools, .scripts {
    padding: 12px 16px;
  }
  .detail-head { display: flex; justify-content: space-between; gap: 12px; align-items: start; min-width: 0; }
  .detail-head > div:first-child { min-width: 0; flex: 1; }
  .detail-head h3 { margin: 0; font-size: 20px; line-height: 1.2; }
  .detail-head p { margin: 6px 0 0; color: var(--muted); font-size: 14px; max-width: 62ch; }
  .meta {
    flex: 0 1 9em;
    min-width: 0;
    overflow: hidden;
    font-size: 12px;
    color: var(--muted);
    text-align: right;
    word-break: break-all;
  }
  .tools { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
  .sync-card[hidden] { display: none; }
  .sync-card {
    position: fixed;
    inset: 0;
    z-index: 30;
    display: grid;
    place-items: center;
    padding: 24px;
    background: rgba(27, 22, 18, 0.32);
  }
  .sync-card article {
    width: min(420px, 100%);
    background: var(--sheet);
    border: 1px solid var(--line);
    border-radius: 8px;
    box-shadow: 0 16px 40px rgba(28, 33, 28, 0.16);
    padding: 18px;
  }
  .sync-card h3 { margin: 0; font-size: 18px; line-height: 1.2; }
  .sync-card p { margin: 8px 0 16px; color: var(--muted); font-size: 14px; }
  .sync-card .choices { display: flex; flex-direction: column; gap: 10px; }
  .sync-card .choices button {
    width: 100%;
    text-align: left;
    border: 1px solid var(--ink);
    background: transparent;
    padding: 14px 14px;
  }
  .sync-card .choices button:hover { background: var(--ink); color: var(--sheet); }
  .sync-card.wide article { width: min(720px, 100%); }
  .sync-card pre, textarea, .scripts code, .doc pre { font-family: "Cascadia Code", "Consolas", monospace; }
  .sync-card pre { white-space: pre-wrap; border: 1px solid var(--line); border-radius: 4px; padding: 10px 12px; font-size: 12px; margin: 0 0 14px; }
  .sync-card .choices select { width: 100%; border: 1px solid var(--ink); background: transparent; padding: 10px; }
  .calls-head { display: flex; align-items: center; gap: 14px; margin: 0 0 8px; }
  .calls-head h2 { margin: 0; }
  .calls-head button, .chip button, .chip-add {
    border: 1px solid var(--ink);
    background: transparent;
    padding: 2px 8px;
    font-size: 13px;
  }
  select, .tools button, .save {
    border: 1px solid var(--ink);
    background: transparent;
    padding: 7px 10px;
  }
  .save { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  textarea {
    width: 100%;
    height: 100%;
    resize: none;
    border: 0;
    background: transparent;
    padding: 14px 16px 20px;
    outline: none;
    font-size: 13px;
    line-height: 1.55;
  }
  .scripts { color: var(--muted); font-size: 13px; border-top: 1px solid var(--line); }
  .scripts code { font-size: 12px; }
  .empty { padding: 28px 16px; color: var(--muted); }
  .status { margin-left: auto; font-size: 12px; color: var(--muted); }
  .views { display: flex; gap: 4px; margin-top: 8px; }
  .views button, .row button, .settings button, .calls-head button, .chip button, .chip-add, .tools button, select, .pick-actions button, .ticket-card > button, .lib-install button, #refresh-library, .lib-detail .go-install, a.lib-jump small, .lib-jump button {
    border: 1px solid var(--line);
    border-radius: 4px;
    background: var(--sheet);
    padding: 4px 8px;
    font-size: 13px;
  }
  .views button.on { background: var(--ink); color: var(--sheet); border-color: var(--ink); }
  .sheet { display: none; min-height: 0; overflow: auto; margin: 0 20px 16px; background: var(--sheet); border: 1px solid var(--line); border-radius: 6px; padding: 12px 14px 18px; }
  .sheet.on { display: block; grid-row: 3; }
  main.off { display: none; }
  #library-view .note { max-width: none; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; border-bottom: 1px solid var(--line); padding: 8px 6px; vertical-align: top; }
  #calls-view td:first-child { white-space: nowrap; }
  #calls-view td:last-child { white-space: normal; }
  #calls-view .skill-line {
    display: grid;
    grid-template-columns: minmax(10em, 1fr) 4.5em 4.5em 6.5em;
    align-items: center;
    column-gap: 8px;
  }
  #calls-view .skill-line + .skill-line { margin-top: 6px; }
  #calls-view .skill-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #calls-view .skill-line button { width: 100%; height: 26px; padding: 0 8px; line-height: 24px; box-sizing: border-box; }
  button.switch {
    width: 36px; height: 20px; padding: 0; border-radius: 999px; border: 1px solid var(--line);
    background: #e4ded4; position: relative; flex: 0 0 auto;
  }
  button.switch.on { background: var(--accent); border-color: var(--accent); }
  button.switch i {
    position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: #fff;
  }
  button.switch.on i { left: 18px; }
  .row-tools { display: flex; align-items: center; gap: 8px; }
  #source-card input { width: 100%; margin: 0 0 12px; }
  #source-kinds { display: flex; gap: 8px; margin-bottom: 12px; }
  #source-kinds button.on { background: var(--ink); color: var(--sheet); }
  th { font-size: 12px; font-weight: 700; color: var(--muted); }
  .chip { display: inline-flex; gap: 4px; align-items: center; margin: 0 6px 4px 0; }
  .settings label { display: block; margin: 12px 0 4px; font-size: 13px; font-weight: 700; }
  .settings .path-row, .settings .action-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: 8px 0; }
  .settings .path-row input { flex: 1; min-width: 220px; height: 32px; box-sizing: border-box; }
  .settings .path-row button, .settings .action-row button { height: 32px; box-sizing: border-box; }
  .settings input[type="text"], .settings input[type="number"] { width: min(100%, 640px); }
  .settings a, .lib-actions a, a.lib-jump small, .lib-jump a { color: var(--accent); }
  .note { color: var(--muted); font-size: 14px; max-width: 68ch; }
  .install-track { height: 8px; max-width: 420px; margin: 8px 0; background: var(--line); border-radius: 99px; overflow: hidden; }
  .install-track span { display: block; height: 100%; width: 0; background: var(--accent); }
  .install-track.failed span { background: #9a3412; }
  .dir-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 8px; margin: 8px 0 0; }
  .dir-list a { display: block; border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; text-decoration: none; color: inherit; background: var(--sheet); }
  .dir-list a:hover { background: var(--fill); }
  .dir-list strong { display: block; font-size: 13px; }
  .dir-list span { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; line-height: 1.4; }
  .lib-extra { margin: 22px 0 8px; padding-top: 16px; border-top: 1px solid var(--line); }
  .lib-extra h3 { margin: 0 0 6px; font-size: 14px; }
  #library-view.on { display: block; overflow: auto; }
  .lib-center { width: 100%; }
  .lib-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .lib-head h2 { margin: 0; padding: 0; }
  .lib-days { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 0; }
  .lib-days button.on { background: var(--fill); box-shadow: inset 3px 0 0 var(--accent); }
  .calls-head h2 { padding: 0; }
  .lib-stage { display: grid; grid-template-columns: minmax(0, 1fr); align-items: start; }
  #library-view.picked .lib-stage { grid-template-columns: minmax(260px, 320px) minmax(0, 1fr); gap: 20px; align-items: start; }
  .lib-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 14px 0 4px; }
  #library-view.picked .lib-cards { grid-template-columns: 1fr; margin-top: 0; }
  .lib-card {
    cursor: pointer;
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    column-gap: 10px;
    row-gap: 4px;
    text-align: left;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--sheet);
    padding: 10px 12px;
  }
  .lib-card:hover { background: #fbfaf7; }
  .lib-card strong, .lib-row b { font-weight: 700; }
  .lib-card em, .lib-row small { font-style: normal; font-size: 12px; color: var(--muted); }
  .lib-card p {
    grid-column: 1 / -1;
    margin: 0;
    color: var(--muted);
    font-size: 13px;
    line-height: 1.45;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .lib-card.on { background: var(--fill); box-shadow: inset 3px 0 0 var(--accent); }
  .lib-card.on p, .lib-card.on em { color: var(--muted); }
  .lib-index { margin-top: 6px; }
  .lib-row {
    width: 100%;
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    gap: 2px 12px;
    text-align: left;
    border: 0;
    border-bottom: 1px solid var(--line);
    background: transparent;
    padding: 9px 4px;
  }
  .lib-row span {
    grid-column: 1 / -1;
    color: var(--muted);
    font-size: 13px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .lib-install { display: flex; gap: 8px; align-items: center; }
  .lib-install input { width: 220px; }
  .lib-install button, #refresh-library, .lib-detail .go-install, .lib-jump button { white-space: nowrap; }
  .lib-card a { color: inherit; text-decoration: none; }
  .lib-card a:hover { color: var(--accent); }
  .lib-detail { display: none; min-width: 0; }
  #library-view.picked .lib-detail {
    display: block;
    min-width: 0;
    padding: 4px 8px 8px 0;
    animation: lib-slide-in 0.46s cubic-bezier(.22, .8, .24, 1);
  }
  @keyframes lib-slide-in {
    from { opacity: 0; transform: translateX(40px); }
    to { opacity: 1; transform: none; }
  }
  .lib-detail h3 { margin: 8px 0 0; font-size: 22px; line-height: 1.2; }
  .lib-kicker { margin: 12px 0 0; color: var(--muted); font-size: 12px; font-weight: 700; }
  .lib-detail .intro { margin: 8px 0 0; max-width: 68ch; }
  .lib-detail .intro p { margin: 0 0 10px; font-size: 14px; line-height: 1.6; }
  .lib-back { border: 0; background: transparent; padding: 0; color: var(--accent); font-size: 13px; }
  .lib-actions { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; margin: 12px 0 0; }
  .lib-actions span { color: var(--muted); font-size: 12px; }
  .lib-actions a { text-decoration: none; font-size: 13px; }
  .lib-actions a:hover { text-decoration: underline; }
  .lib-skills { display: grid; grid-template-columns: 1fr; gap: 8px; margin-top: 14px; }
  #library-view.picked .lib-jump { animation: lib-row 0.4s ease both; }
  @keyframes lib-row {
    from { opacity: 0; transform: translateX(16px); }
    to { opacity: 1; transform: none; }
  }
  .lib-jump {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    min-width: 0;
    padding: 8px 10px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--sheet);
  }
  .lib-jump a { color: inherit; text-decoration: none; font-weight: 700; }
  .lib-jump a:hover { color: var(--accent); }
  .lib-jump span { display: flex; gap: 6px; align-items: center; flex: none; }
  .lib-jump span a { font-weight: 400; font-size: 12px; color: var(--accent); }
  .doc { margin: 8px 0 18px; }
  .doc pre { white-space: pre-wrap; border: 1px solid var(--line); padding: 10px 12px; font-family: "IBM Plex Mono", monospace; font-size: 12px; max-width: 78ch; }
  @media (max-width: 1100px) {
    header { grid-template-columns: 1fr; gap: 10px; padding: 14px 14px 8px; }
    .mark h1 { font-size: 20px; }
    main {
      grid-template-columns: 1fr;
      grid-template-rows: auto minmax(148px, 30vh) minmax(0, 1fr);
      padding: 0 12px 12px;
      gap: 8px;
      overflow: hidden;
    }
    .cats { display: flex; flex-wrap: wrap; gap: 6px; max-height: 96px; }
    .cat { width: auto; padding: 4px 8px; border: 1px solid var(--line); }
  }
  @media (max-width: 760px) {
    .lib-cards, #library-view.picked .lib-stage { grid-template-columns: 1fr; }
    .lib-install input { width: min(100%, 220px); }
  }
  /* ===================== 设计层（D 方向：密度 + 卡片，双主题） ===================== */
  :root, html[data-theme="light"]{
    --bg:#f4f6f8; --sheet:#fff; --card:#fff; --panel2:#fbfcfd; --soft:#f1f4f7;
    --ink:#12161c; --muted:#6b7480; --line:#e5e9ee; --line-soft:#eef1f5;
    --accent:#0f7a5f; --accent-ink:#fff; --fill:#e6f4ef; --warn:#9a6b1f;
    --radius:14px; --radius-sm:10px; --rail:196px;
    --shadow:0 1px 2px rgba(16,24,40,.05), 0 10px 28px -14px rgba(16,24,40,.22);
    --ring:0 0 0 3px rgba(15,122,95,.18);
  }
  html[data-theme="dark"]{
    --bg:#0e1116; --sheet:#161a21; --card:#161a21; --panel2:#12161c; --soft:#1b212a;
    --ink:#e7ebf0; --muted:#98a2ae; --line:#252b34; --line-soft:#1d232b;
    --accent:#34c39a; --accent-ink:#06231b; --fill:#12312a; --warn:#e0a458;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 12px 30px -16px rgba(0,0,0,.7);
    --ring:0 0 0 3px rgba(52,195,154,.22);
  }
  html, body { height: 100%; }
  body{ background:var(--bg); color:var(--ink); font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif; font-size:13.5px; }
  ::selection{ background:var(--fill); }
  [hidden]{ display:none !important; }
  *:focus-visible{ outline:2px solid var(--accent); outline-offset:1px; }
  *::-webkit-scrollbar{ width:10px; height:10px; }
  *::-webkit-scrollbar-thumb{ background:var(--line); border-radius:8px; border:3px solid transparent; background-clip:content-box; }
  *::-webkit-scrollbar-track{ background:transparent; }

  /* ---- 外壳：左导航竖栏 + 顶栏（用 display:contents 把 header 的子项提为网格项，不改标记） ---- */
  body .app{
    display:grid; height:100vh; height:100dvh; overflow:hidden;
    grid-template-columns:var(--rail) minmax(0,1fr);
    grid-template-rows:auto auto auto minmax(0,1fr);
    grid-template-areas:
      "title top"
      "count top"
      "nav   ticket"
      "nav   main";
  }
  body .app > header, body .app > header > .mark{ display:contents; }
  body .app > header h1{ grid-area:title; background:var(--panel2); border-right:1px solid var(--line); margin:0; padding:15px 15px 2px; font-size:19px; font-weight:700; }
  body .app > header #count{ grid-area:count; background:var(--panel2); border-right:1px solid var(--line); margin:0; padding:0 15px 13px; color:var(--muted); font-size:12px; font-variant-numeric:tabular-nums; }
  body .app .views{ grid-area:nav; background:var(--panel2); border-right:1px solid var(--line); display:flex; flex-direction:column; gap:2px; padding:8px 8px 12px; margin:0; overflow:auto; }
  body .app .views button{
    text-align:left; border:1px solid transparent; background:transparent; color:var(--ink);
    border-radius:9px; padding:8px 11px; font-size:13.5px; font-weight:500;
  }
  body .app .views button:hover{ background:var(--soft); }
  body .app .views button.on{ background:var(--fill); border-color:var(--accent); color:var(--accent); font-weight:600; }
  body .app .route{
    grid-area:top; display:flex; gap:10px; align-items:center; margin:0;
    padding:10px 14px; background:var(--sheet); border-bottom:1px solid var(--line);
  }
  body .app .route > div:first-child{ flex:1; min-width:0; }
  body .app .route label{ display:block; color:var(--muted); font-size:11.5px; margin-bottom:3px; }
  body .app .route input[type=text], body .app .route input:not([type]){
    width:100%; background:var(--panel2); border:1px solid var(--line); border-radius:10px;
    padding:8px 12px; color:var(--ink); font-size:13.5px;
  }
  body .app .route input:focus{ border-color:var(--accent); outline:none; box-shadow:var(--ring); }
  .kit-tools{ display:flex; gap:8px; align-items:center; flex:none; }
  .seg{ display:flex; gap:2px; background:var(--panel2); border:1px solid var(--line); border-radius:999px; padding:2px; }
  .seg button{ border:0; background:transparent; color:var(--muted); border-radius:999px; padding:5px 12px; font-size:12.5px; }
  .seg button.on{ background:var(--accent); color:var(--accent-ink); font-weight:600; }
  body .app .ticket{ grid-area:ticket; padding:12px 14px 0; }
  body .app main{ grid-area:main; display:grid; grid-template-columns:200px minmax(0,1fr) 372px; gap:13px; padding:14px; overflow:hidden; min-height:0; }
  body .app .sheet.on{ grid-area:main; margin:14px; padding:0; overflow:auto; background:var(--sheet); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); }

  /* ---- 通用元件 ---- */
  button{ font:inherit; color:inherit; cursor:pointer; }
  button:not(.go):not(.save):not(.go-install):not(.switch){
    background:var(--sheet); border:1px solid var(--line); border-radius:9px; padding:5px 11px; font-size:12.5px;
  }
  button:not(.go):not(.save):not(.go-install):not(.switch):hover{ background:var(--soft); border-color:var(--accent); }
  .go, .save, .go-install{
    background:var(--accent); border:1px solid var(--accent); color:var(--accent-ink);
    border-radius:10px; padding:8px 16px; font-weight:600; font-size:13.5px;
  }
  .go:hover, .save:hover, .go-install:hover{ filter:brightness(1.06); }
  select, input[type=text], input:not([type]), textarea{
    background:var(--panel2); border:1px solid var(--line); border-radius:9px; padding:6px 10px; color:var(--ink); font:inherit;
  }
  select:focus, input:focus, textarea:focus{ border-color:var(--accent); outline:none; box-shadow:var(--ring); }
  input[type=checkbox]{ accent-color:var(--accent); }
  code{ font-family:Consolas,ui-monospace,monospace; background:var(--soft); border:1px solid var(--line); border-radius:6px; padding:1px 6px; font-size:12px; }
  .note{ color:var(--muted); font-size:12.5px; line-height:1.6; }
  .status{ color:var(--muted); font-size:12px; }
  .changed{ color:var(--warn); font-style:normal; font-size:11.5px; margin-left:6px; }
  .meta{ color:var(--muted); font-size:12px; text-align:right; }
  .install-track{ height:6px; background:var(--soft); border:1px solid var(--line); border-radius:999px; overflow:hidden; margin:8px 0; }
  .install-track > span{ display:block; height:100%; background:var(--accent); }
  .install-track.failed > span{ background:var(--warn); }

  /* ---- 柜：分类 / 列表 / 详情 ---- */
  body .app main > .pane{ background:var(--sheet); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); padding:12px; min-height:0; overflow:auto; display:flex; flex-direction:column; }
  body .app main > .pane > h2{ margin:0 0 9px; font-size:12px; color:var(--muted); letter-spacing:.05em; text-transform:uppercase; font-weight:600; }
  .cats{ display:flex; flex-direction:column; gap:2px; }
  .cat{ display:flex; justify-content:space-between; align-items:center; gap:8px; background:transparent; border:1px solid transparent; border-radius:8px; padding:6px 9px; color:var(--muted); font-size:12.5px; }
  .cat em{ font-style:normal; font-variant-numeric:tabular-nums; }
  .cat:hover{ background:var(--soft); color:var(--ink); }
  .cat.active{ background:var(--fill); border-color:var(--accent); color:var(--accent); font-weight:600; }
  .search{ width:100%; margin-bottom:9px; }
  .list{ display:flex; flex-direction:column; gap:4px; }
  .skill{ display:flex; flex-direction:column; align-items:flex-start; gap:2px; text-align:left; background:var(--panel2); border:1px solid var(--line); border-radius:9px; padding:7px 10px; }
  .skill b{ font-size:13px; font-weight:600; }
  .skill small{ color:var(--muted); font-size:11.5px; }
  .skill:hover{ background:var(--soft); border-color:var(--accent); }
  .skill.active{ background:var(--fill); border-color:var(--accent); box-shadow:inset 3px 0 0 var(--accent); }
  html[data-view="cards"] .list{ display:grid; grid-template-columns:1fr 1fr; gap:11px; }
  html[data-view="cards"] .skill{ background:var(--card); border-radius:12px; padding:12px 13px; gap:5px; box-shadow:var(--shadow); }
  html[data-view="cards"] .skill b{ font-size:13.5px; }
  .detail-head{ display:flex; justify-content:space-between; gap:10px; padding-bottom:10px; border-bottom:1px solid var(--line-soft); }
  .detail-head h3{ margin:0 0 4px; font-size:16px; }
  .detail-head p{ margin:0; color:var(--muted); font-size:12.5px; }
  .tools{ display:flex; flex-wrap:wrap; gap:7px; align-items:center; padding:10px 0; }
  #editor{ width:100%; flex:1; min-height:320px; resize:vertical; font-family:Consolas,ui-monospace,monospace; font-size:12.5px; line-height:1.6; }
  .scripts{ padding-top:8px; color:var(--muted); font-size:12px; }
  .empty{ color:var(--muted); text-align:center; padding:26px 12px; line-height:1.7; }

  /* ---- 选择票 ---- */
  .ticket-card{ background:var(--sheet); border:1px solid var(--line); border-left:4px solid var(--accent); border-radius:var(--radius-sm); box-shadow:var(--shadow); padding:12px 14px; display:flex; flex-wrap:wrap; gap:10px 14px; align-items:flex-start; }
  .ticket-card .pick{ background:var(--panel2); border:1px solid var(--line); border-radius:10px; padding:8px 11px; min-width:150px; }
  .ticket-card .pick .k{ color:var(--muted); font-size:11.5px; }
  .ticket-card .pick strong{ display:block; font-size:14px; }
  .ticket-card .pick span{ color:var(--muted); font-size:12px; }
  .ticket-card .pick-actions{ margin-top:6px; display:flex; gap:6px; }
  .ticket-wait, .ticket-error{ background:var(--sheet); border:1px solid var(--line); border-radius:var(--radius-sm); padding:10px 14px; }
  .ticket-wait{ color:var(--muted); }
  .ticket-error{ color:var(--warn); border-left:4px solid var(--warn); }
  .bars{ display:flex; flex-direction:column; gap:4px; min-width:220px; }
  .bar{ display:grid; grid-template-columns:96px minmax(0,1fr) 34px; gap:8px; align-items:center; font-size:12px; color:var(--muted); }
  .bar i{ display:block; height:6px; background:var(--soft); border-radius:999px; overflow:hidden; }
  .bar i b{ display:block; height:100%; background:var(--accent); }
  .passed{ color:var(--warn); font-size:12px; }

  /* ---- 各面公共：标题行 / 表格 / 芯片 / 行工具 ---- */
  .calls-head{ display:flex; justify-content:space-between; align-items:center; gap:10px; padding:14px 16px; border-bottom:1px solid var(--line); }
  .calls-head h2{ margin:0; font-size:16px; }
  .sheet > .note, .sheet > p{ margin:10px 16px; }
  .sheet table{ width:100%; border-collapse:collapse; }
  .sheet th, .sheet td{ text-align:left; padding:8px 16px; border-bottom:1px solid var(--line-soft); vertical-align:top; }
  .sheet th{ color:var(--muted); font-size:11.5px; letter-spacing:.04em; text-transform:uppercase; font-weight:600; }
  .sheet tr:hover td{ background:var(--soft); }
  .row-tools{ display:flex; gap:6px; }
  .chip{ display:inline-flex; align-items:center; gap:5px; background:var(--fill); border:1px solid var(--accent); color:var(--accent); border-radius:999px; padding:1px 9px; font-size:11.5px; margin:2px 2px 2px 0; }
  .chip button{ border:0; background:transparent; color:inherit; padding:0 0 0 2px; font-size:11.5px; }
  .skill-line{ display:grid; grid-template-columns:minmax(0,1fr) auto auto auto; gap:8px; align-items:center; }
  .skill-name{ font-family:Consolas,ui-monospace,monospace; font-size:12.5px; }
  .chip-add{ border:1px solid var(--line); background:var(--sheet); border-radius:999px; padding:1px 9px; font-size:11.5px; }
  .path-row, .action-row{ display:flex; flex-wrap:wrap; gap:8px; margin:10px 16px; }
  #skill-roots{ list-style:none; margin:10px 16px; padding:0; }
  #skill-roots li{ display:flex; justify-content:space-between; gap:10px; padding:6px 0; border-bottom:1px solid var(--line-soft); font-family:Consolas,ui-monospace,monospace; font-size:12px; }
  .add-results{ display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:10px; }
  .settings > label{ display:flex; align-items:center; gap:8px; margin:10px 16px; }

  /* ---- 库 ---- */
  .lib-center{ padding:14px 16px; }
  .lib-head{ display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  .lib-install{ display:flex; gap:6px; flex:1; min-width:220px; }
  .lib-install input{ flex:1; }
  .lib-days{ display:flex; flex-wrap:wrap; gap:6px; margin:8px 0; }
  .lib-stage{ display:grid; grid-template-columns:minmax(0,1fr) 420px; gap:13px; margin-top:10px; align-items:start; }
  .lib-cards{ display:grid; grid-template-columns:1fr 1fr; gap:11px; }
  .lib-card{ background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px 13px; box-shadow:var(--shadow); }
  .lib-card:hover{ border-color:var(--accent); }
  .lib-detail{ background:var(--panel2); border:1px solid var(--line); border-radius:var(--radius); padding:14px; position:sticky; top:0; }
  .lib-kicker{ color:var(--muted); font-size:11.5px; letter-spacing:.05em; text-transform:uppercase; margin:0 0 6px; }
  .intro{ color:var(--muted); font-size:12.5px; line-height:1.7; }
  .lib-actions{ display:flex; justify-content:space-between; align-items:center; gap:10px; margin:10px 0; }
  .lib-skills{ display:flex; flex-direction:column; gap:6px; }
  .lib-jump{ animation:none; background:var(--sheet); border:1px solid var(--line); border-radius:10px; padding:8px 11px; }
  .lib-extra{ margin:14px 16px; }
  .dir-list{ display:grid; grid-template-columns:1fr 1fr; gap:8px; }

  /* ---- 弹层 ---- */
  body .app > .sync-card{ position:fixed; inset:0; z-index:40; display:grid; place-items:center; background:rgba(8,12,16,.5); backdrop-filter:blur(2px); }
  body .app > .sync-card > article{ width:min(560px,92vw); max-height:86vh; overflow:auto; background:var(--sheet); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); padding:18px 20px; }
  body .app > .sync-card.wide > article{ width:min(720px,94vw); }
  body .app > .sync-card h3{ margin:0 0 8px; font-size:16px; }
  body .app > .sync-card pre{ background:var(--panel2); border:1px solid var(--line); border-radius:10px; padding:10px 12px; overflow:auto; font-size:12px; }
  .choices{ display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }

  /* ---- 修正：胶囊切换器必须压过上面的通用 button 规则 ---- */
  body .app .route .seg button{ border:0; background:transparent; color:var(--muted); border-radius:999px; padding:5px 12px; font-size:12.5px; box-shadow:none; }
  body .app .route .seg button:hover{ background:var(--soft); border:0; }
  body .app .route .seg button.on{ background:var(--accent); color:var(--accent-ink); font-weight:600; }
  /* ---- 修正：表格等宽列，别再让窄列一字一行 ---- */
  .sheet table{ table-layout:fixed; width:100%; }
  .sheet th, .sheet td{ white-space:normal; overflow-wrap:anywhere; word-break:break-word; }
  .sheet td button{ white-space:nowrap; }

  /* ============ Stage 2：导航计数 · 详情动作条 · 库面细节 ============ */
  /* 导航项：去掉通用按钮带出的浅框；计数靠右、空则不占位 */
  body .app header .views button{
    display:grid; grid-template-columns:18px minmax(0,1fr) auto; gap:10px; align-items:center;
    border:1px solid transparent !important; background:transparent !important; box-shadow:none !important;
  }
  body .app header .views button:hover{ background:var(--soft) !important; }
  body .app header .views button.on{ background:var(--fill) !important; border-color:var(--accent) !important; }
  .views .n{ font-style:normal; color:var(--muted); font-size:11.5px; font-variant-numeric:tabular-nums; }
  .views button.on .n{ color:var(--accent); }
  .views .n:empty{ display:none; }

  /* 详情：字段分组 + 底部动作条（用 order 重排，不改 JS 生成的顺序） */
  body .app main > .pane.detail > .detail-head{ order:1; }
  body .app main > .pane.detail > #editor{ order:2; border-radius:var(--radius-sm); }
  body .app main > .pane.detail > .scripts{ order:3; }
  body .app main > .pane.detail > .tools{
    order:4; position:sticky; bottom:-12px; margin:10px -12px -12px; padding:10px 12px;
    background:var(--panel2); border-top:1px solid var(--line); border-radius:0 0 var(--radius) var(--radius);
  }
  body .app main > .pane.detail > .tools select{ min-width:118px; }
  body .app main > .pane.detail > .tools .status{ margin-left:auto; }
  /* 详情动作条上的主按钮必须看起来是主按钮（旧 .save 规则会盖掉强调色） */
  body .app main > .pane.detail > .tools .save{
    background:var(--accent) !important; color:var(--accent-ink) !important; border:1px solid var(--accent) !important;
    border-radius:10px; padding:7px 15px; font-weight:600;
  }

  /* 库：卡片与详情细节 */
  .lib-card b{ display:block; font-size:13.5px; margin-bottom:3px; }
  .lib-card small{ color:var(--muted); font-size:12px; }
  .lib-extra{ background:var(--sheet); border:1px solid var(--line); border-radius:var(--radius); padding:12px 14px; }
  .dir-list > *{ background:var(--panel2); border:1px solid var(--line); border-radius:9px; padding:8px 10px; font-size:12.5px; color:var(--ink); text-decoration:none; overflow-wrap:anywhere; }
  .dir-list > *:hover{ border-color:var(--accent); }
  .lib-install input{ min-width:0; }
  .go-install{ white-space:nowrap; }

  /* ============ Stage 3：图标 · 可收起侧栏 · 列表摘要 · 键盘 ============ */
  /* 修 bug：设计层的 `body .app main{display:grid}` 压过了旧规则 `main.off{display:none}`，
     导致看 MCP / 派遣 等面时，技能详情还露在下面（用户截图里那条动作条） */
  body .app main.off{ display:none; }

  .views button .ic{ width:17px; height:17px; color:var(--muted); flex:none; }
  body .app header .views button.on .ic{ color:var(--accent); }
  body .app header .views button:hover .ic{ color:var(--ink); }
  body .app header .views button{ padding:8px 10px; }
  body .app header .views .rail-toggle{ margin-top:auto; color:var(--muted); }
  body .app header .views .rail-toggle:hover{ color:var(--ink); }
  .cats-hint{ color:var(--muted); font-size:11.5px; margin:8px 2px 0; line-height:1.55; }
  .skill .sum{ color:var(--muted); font-size:11.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:100%; }

  /* 收起态：只留图标 */
  html[data-rail="collapsed"]{ --rail:58px; }
  html[data-rail="collapsed"] body .app header .views button{ grid-template-columns:1fr; justify-items:center; padding:9px 0; }
  html[data-rail="collapsed"] body .app header .views button span{ display:none; }
  html[data-rail="collapsed"] body .app header .views .n{ display:none; }
  html[data-rail="collapsed"] body .app header .views .ic{ width:19px; height:19px; }
  html[data-rail="collapsed"] body .app > header h1{
    writing-mode:vertical-rl; font-size:13px; letter-spacing:2px; text-align:center; padding:14px 0 8px;
  }
  html[data-rail="collapsed"] body .app > header #count{ display:none; }

  /* ============ Stage 4：内容区对齐 · 库页右边缘 · 派遣页分组 ============ */
  /* 对齐：内容区与顶栏用同一条 14px 边线（原来 sheet 20px + 内部 14px 会差出两层） */
  body .app .sheet.on{ margin:12px 14px 14px; }
  body .app .calls-head{ padding:14px; }
  body .app .sheet > .note, body .app .sheet > p, body .app .sheet > label{ margin:10px 14px; }
  body .app .sheet th, body .app .sheet td{ padding:8px 14px; }
  body .app #skill-roots, body .app .path-row, body .app .action-row, body .app .settings > label{ margin:10px 14px; }

  /* 库页：原来我把它写死成两列 420px，覆盖了原 CSS 的 .picked 判断 →
     没选仓库时右边空一块、卡片右边缘参差。恢复「未选=单列、选中=两列」。 */
  body .app .lib-stage{ grid-template-columns:minmax(0,1fr); }
  body .app #library-view.picked .lib-stage{ grid-template-columns:minmax(0,1fr) 420px; }
  body .app #library-view.picked .lib-cards{ grid-template-columns:1fr; }
  body .app .lib-center{ padding:0; }
  body .app .lib-days, body .app .lib-head, body .app .lib-stage, body .app .lib-extra{ margin:14px; }
  body .app .lib-cards{ margin:0; gap:12px; }
  body .app .lib-extra{ padding:12px 14px; }

  /* 派遣页：建议 / 观测 分组标题与状态色 */
  body .app h3.group{ margin:16px 14px 6px; font-size:12.5px; color:var(--muted); display:flex; align-items:center; gap:8px; font-weight:600; }
  body .app h3.group .count{ background:var(--soft); border:1px solid var(--line); border-radius:999px; padding:0 8px; font-size:11.5px; font-variant-numeric:tabular-nums; }
  body .app td.muted-cell{ color:var(--muted); }
  .pill.err{ background:#fdeceb; border-color:#d99b93; color:#8f3d32; }
  html[data-theme="dark"] .pill.err{ background:#2a1514; border-color:#7a3b32; color:#f0a8a0; }
  .pill.muted{ color:var(--muted); }

  /* ============ Stage 5：决策详情抽屉 ============ */
  body .app .drawer-scrim{ position:fixed; inset:0; z-index:30; background:rgba(8,12,16,.38); }
  body .app .drawer{
    position:fixed; top:0; right:0; bottom:0; z-index:31; width:min(460px, 94vw);
    background:var(--sheet); border-left:1px solid var(--line); box-shadow:var(--shadow);
    display:flex; flex-direction:column;
  }
  .drawer-hd{ display:flex; justify-content:space-between; align-items:center; gap:10px; padding:14px; border-bottom:1px solid var(--line); }
  .drawer-hd h3{ margin:0; font-size:15px; }
  .drawer-body{ padding:14px; overflow:auto; display:flex; flex-direction:column; gap:15px; }
  .drawer-body h4{ margin:0 0 6px; font-size:11.5px; letter-spacing:.04em; text-transform:uppercase; color:var(--muted); font-weight:600; }
  .drawer-body .q{ margin:0; font-size:14.5px; line-height:1.65; overflow-wrap:anywhere; }
  .drawer-body .kv{ display:grid; grid-template-columns:88px minmax(0,1fr); gap:5px 10px; margin:0; font-size:12.5px; }
  .drawer-body .kv dt{ color:var(--muted); }
  .drawer-body .kv dd{ margin:0; overflow-wrap:anywhere; }
  .drawer-body details{ border:1px solid var(--line); border-radius:10px; padding:8px 11px; background:var(--panel2); }
  .drawer-body summary{ cursor:pointer; color:var(--muted); font-size:12.5px; }
  .drawer-body details code{ display:block; margin-top:7px; overflow-wrap:anywhere; }
  .drawer-body .chips button{ cursor:pointer; }
  .drawer-body .gate{ display:grid; grid-template-columns:minmax(0,1fr) auto; gap:2px 8px; padding:7px 0; border-bottom:1px solid var(--line-soft); }
  .drawer-body .gate:last-child{ border-bottom:0; }
  .drawer-body .gate b{ font-size:12.5px; font-weight:600; }
  .drawer-body .gate .pct{ color:var(--muted); font-size:12px; font-variant-numeric:tabular-nums; }
  .drawer-body .gate small{ grid-column:1 / -1; color:var(--muted); font-size:11.5px; }
  .drawer-body .gate.ok b{ color:var(--accent); }
  body .app tr.row-click{ cursor:pointer; }

  /* 调用 / 派遣：任务和详情只占一行，全文点开右侧抽屉 */
  body .app #calls-view table,
  body .app #delegation-view table { table-layout: fixed; }
  body .app #calls-view td,
  body .app #delegation-view td { vertical-align: middle; }
  body .app #delegation-view tbody td,
  body .app #calls-view td.clip {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    max-width: 0;
  }
  html[data-view="cards"] body .app #calls-view td.clip,
  html[data-view="cards"] body .app #delegation-view tbody td { max-width: 100%; }

  /* ============ Stage 6：开关看得懂 · 列表/卡片对全站生效 ============ */
  /* 启用开关：原来被通用 button 规则盖掉，旋钮和颜色都没了 → 看不出开还是关 */
  body .app button.switch{
    width:40px; height:22px; padding:0; border-radius:999px; background:var(--soft); border:1px solid var(--line);
    position:relative; flex:none; box-shadow:none;
  }
  body .app button.switch i{
    position:absolute; top:2px; left:2px; width:16px; height:16px; border-radius:50%;
    background:var(--muted); transition:left .15s ease, background .15s ease;
  }
  body .app button.switch.on{ background:var(--accent); border-color:var(--accent); }
  body .app button.switch.on i{ left:20px; background:var(--accent-ink); }
  body .app button.switch:hover{ border-color:var(--accent); }
  body .app .switch-text{ font-size:11.5px; color:var(--muted); min-width:1.1em; }
  body .app .switch-text.on{ color:var(--accent); font-weight:600; }

  /* 卡片视图：所有面的表格都变卡片，字段名取自每格自己的 data-label */
  html[data-view="cards"] body .app .sheet thead{ display:none; }
  html[data-view="cards"] body .app .sheet table,
  html[data-view="cards"] body .app .sheet tbody{ display:block; }
  html[data-view="cards"] body .app .sheet tbody{ display:grid; grid-template-columns:1fr 1fr; gap:11px; padding:12px 14px; }
  html[data-view="cards"] body .app .sheet tr{
    display:block; background:var(--card); border:1px solid var(--line); border-radius:12px;
    box-shadow:var(--shadow); padding:11px 13px;
  }
  html[data-view="cards"] body .app .sheet tr:hover td{ background:transparent; }
  html[data-view="cards"] body .app .sheet td,
  html[data-view="cards"] body .app .sheet th{ display:block; border:0; padding:3px 0; }
  html[data-view="cards"] body .app .sheet td[data-label]::before{ content:attr(data-label) " · "; color:var(--muted); font-size:11.5px; }
  html[data-view="cards"] body .app .sheet td:empty{ display:none; }
  @media (max-width: 1000px){
    html[data-view="cards"] body .app .sheet tbody{ grid-template-columns:1fr; }
  }

  /* ---- 窄屏 ---- */
  @media (max-width: 1280px){
    body .app main{ grid-template-columns:180px minmax(0,1fr) 320px; }
    .lib-stage{ grid-template-columns:minmax(0,1fr); }
  }
  @media (max-width: 1000px){
    body .app{ grid-template-columns:minmax(0,1fr); grid-template-areas:"title" "count" "top" "nav" "ticket" "main"; }
    body .app > header h1, body .app > header #count, body .app .views{ border-right:0; }
    body .app .views{ flex-direction:row; flex-wrap:wrap; }
    body .app main{ grid-template-columns:minmax(0,1fr); }
    html[data-view="cards"] .list{ grid-template-columns:1fr; }
    .lib-cards, .add-results, .dir-list{ grid-template-columns:1fr; }
  }
</style>

    <article>
      <h3>接入 MCP</h3>
      <p>选技能的是本机 jev-decision。Hermes 和 OpenClaw 在模型开口之前把这句话交给它。DeepSeek Harness 可以装插件，也可以走 MCP。它选定自己做，或选定柜门上的哪几份。模型只执行这个结果，不再挑选。下面的配置只用来读取已经选定的技能正文。</p>
      <pre id="mcp-config"></pre>
      <p><button id="copy-mcp" type="button">复制配置</button></p>
    </article>

</div>
<script>
const state = { categories: [], skills: [], filter: "all", query: "", current: null, dirty: false, libQuery: "", libSearch: null, libDay: null, libHistoryOpen: false, libPick: null, libRepo: null, libraryFeed: null, libraryStatus: "", githubDraft: "", repoCache: {}, scanJob: null, memoryJob: null, pluginJob: null };

const catsEl = document.getElementById("cats");
const listEl = document.getElementById("list");
const detailEl = document.getElementById("detail");
const ticketEl = document.getElementById("ticket");

function formatWhen(value) {
  const date = new Date(value);
  if (!value || Number.isNaN(date.getTime())) return value || "";
  const pad = (n) => String(n).padStart(2, "0");
  return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())} ${pad(date.getHours())}:${pad(date.getMinutes())}`;
}

function esc(value) {
  return String(value ?? "").replace(/[&<>"']/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
}

function clipTd(label, text) {
  const line = String(text || "").replace(/\s+/g, " ").trim();
  return `<td class="clip" data-label="${esc(label)}" title="${esc(line)}">${esc(line)}</td>`;
}

const KIT_TOKEN = "__KIT_TOKEN__";

// 主题 / 视图：跟随系统为默认，手动切换写入本机
(function kitPrefs(){
  const html = document.documentElement;
  function paint(){
    document.querySelectorAll("[data-kit-theme]").forEach((b) => b.classList.toggle("on", b.dataset.kitTheme === html.dataset.theme));
    document.querySelectorAll("[data-kit-view]").forEach((b) => b.classList.toggle("on", b.dataset.kitView === html.dataset.view));
  }
  document.querySelectorAll("[data-kit-theme]").forEach((b) => b.addEventListener("click", () => {
    html.dataset.theme = b.dataset.kitTheme;
    try { localStorage.setItem("kit-theme", html.dataset.theme); } catch (e) {}
    paint();
  }));
  document.querySelectorAll("[data-kit-view]").forEach((b) => b.addEventListener("click", () => {
    html.dataset.view = b.dataset.kitView;
    try { localStorage.setItem("kit-view", html.dataset.view); } catch (e) {}
    paint();
  }));
  try {
    matchMedia("(prefers-color-scheme: dark)").addEventListener("change", (event) => {
      if (localStorage.getItem("kit-theme")) return;
      html.dataset.theme = event.matches ? "dark" : "light";
      paint();
    });
  } catch (e) {}
  paint();
})();

// 左侧导航计数：跟着各面已渲染的内容走，不额外打任何接口
(function kitNavCounts(){
  const html = document.documentElement;
  function setNav(view, value){
    const node = html.querySelector('[data-nav-count="' + view + '"]');
    if (node) node.textContent = value ? String(value) : "";
  }
  function countItems(root){
    const cards = root.querySelectorAll(".lib-card").length;
    if (cards) return cards;
    return Array.from(root.querySelectorAll("tr")).filter((tr) => !tr.querySelector("th")).length;
  }
  const views = [["calls", "calls-view"], ["delegation", "delegation-view"], ["mcp", "mcp-view"],
                 ["plugins", "plugin-view"], ["library", "library-view"]];
  function sync(){
    setNav("cabinet", state && state.skills ? state.skills.length : 0);
    for (const [view, id] of views){
      const root = document.getElementById(id);
      if (!root) continue;
      if (!root.innerHTML.trim()) { setNav(view, 0); continue; }
      const n = countItems(root);
      if (n) setNav(view, n);
    }
  }
  for (const [, id] of views){
    const root = document.getElementById(id);
    if (root) new MutationObserver(sync).observe(root, { childList: true, subtree: true });
  }
  const list = document.getElementById("list");
  if (list) new MutationObserver(sync).observe(list, { childList: true });
  sync();
})();

// 侧栏收起 / 展开（记住选择）
(function kitRail(){
  const html = document.documentElement;
  const button = document.getElementById("rail-toggle");
  let saved = null;
  try { saved = localStorage.getItem("kit-rail"); } catch (e) {}
  html.dataset.rail = saved === "collapsed" ? "collapsed" : "expanded";
  if (button) button.addEventListener("click", () => {
    html.dataset.rail = html.dataset.rail === "collapsed" ? "expanded" : "collapsed";
    try { localStorage.setItem("kit-rail", html.dataset.rail); } catch (e) {}
  });
})();

// 键盘：/ 聚焦技能搜索（Esc 关弹层由原有监听负责，不要重复实现）
document.addEventListener("keydown", (event) => {
  const tag = ((event.target && event.target.tagName) || "").toLowerCase();
  if (event.key !== "/" || tag === "input" || tag === "textarea") return;
  const box = document.getElementById("search");
  if (box) { event.preventDefault(); box.focus(); }
});

// 决策详情抽屉：从调用记录里看清「为什么选了这几个」
function openDecision(id) {
  const call = (state.calls || []).find((item) => item.id === id);
  if (!call) return;
  const skills = call.skills || [];
  const chips = skills.length
    ? skills.map((name) => `<button class="chip" type="button" data-open-skill="${esc(name)}">${esc(name)}</button>`).join("")
    : `<span class="pill muted">没有调用技能（自主思考）</span>`;
  const reasons = Array.isArray(call.reasons) ? call.reasons : [];
  const gateRow = (row) => {
    const pct = Math.round((Number(row.probability) || 0) * 100);
    return `<div class="gate ${row.kept ? "ok" : "no"}"><b>${esc(row.label || "")}</b><span class="pct">${pct > 0 ? pct + "%" : "0"}</span><small>${esc(row.reason || "")}</small></div>`;
  };
  const kept = reasons.filter((row) => row.kept);
  const dropped = reasons.filter((row) => !row.kept);
  const legacy = (!reasons.length && (call.passed || []).length)
    ? `<div><h4>没带上（旧记录只有门名）</h4><p class="note">${(call.passed || []).map((item) => esc(item.name || "")).filter(Boolean).join("、")}</p><p class="note">这条记录早于「保存判定依据」，没有分数可看。</p></div>`
    : "";
  document.getElementById("drawer-body").innerHTML = `
    <div><h4>这次的任务</h4><p class="q">${esc(call.task || "（空）")}</p></div>
    <div><h4>结论</h4>
      <dl class="kv">
        <dt>做法</dt><dd>${call.method === "think" ? "自主思考（不套技能）" : "调用技能"}</dd>
        <dt>门 / 类型</dt><dd>${esc(call.label || call.category || "—")}</dd>
        <dt>来源</dt><dd>${esc(call.sourceLabel || call.source || "—")}</dd>
        <dt>时间</dt><dd>${esc(formatWhen(call.at))}</dd>
      </dl>
    </div>
    <div><h4>选定</h4><div class="chips">${chips}</div></div>
    <div><h4>留下的门</h4>${kept.length ? kept.map(gateRow).join("") : `<p class="note">这次没有留下门（自己做）。</p>`}</div>
    ${dropped.length ? `<div><h4>没带上</h4>${dropped.map(gateRow).join("")}</div>` : ""}
    ${call.unnamedCount ? `<p class="note">另外 ${call.unnamedCount} 个门没被点名，按 0 分计，不逐条列。</p>` : ""}
    ${legacy}
    <div><h4>排障用</h4><details><summary>decision_id（默认折叠）</summary><code>${esc(call.id || "")}</code></details></div>`;
  showDrawer("这次决定");
}
function showDrawer(heading) {
  const title = document.querySelector("#decision-drawer .drawer-hd h3");
  if (title) title.textContent = heading || "这次决定";
  document.getElementById("decision-drawer").hidden = false;
  document.getElementById("drawer-scrim").hidden = false;
}
function closeDecision() {
  document.getElementById("decision-drawer").hidden = true;
  document.getElementById("drawer-scrim").hidden = true;
}
document.getElementById("drawer-close").addEventListener("click", closeDecision);
document.getElementById("drawer-scrim").addEventListener("click", closeDecision);
document.getElementById("drawer-body").addEventListener("click", (event) => {
  const chip = event.target.closest("[data-open-skill]");
  if (!chip) return;
  closeDecision();
  document.querySelector('button[data-view="cabinet"]').click();
  openSkill(chip.dataset.openSkill).catch((error) => alert(error.message));
});
document.addEventListener("keydown", (event) => {
  if (event.key !== "Escape") return;
  const drawer = document.getElementById("decision-drawer");
  if (drawer && !drawer.hidden) closeDecision();
});

async function api(path, options) {
  const headers = { ...(options && options.headers ? options.headers : {}) };
  if (options && options.method && options.method !== "GET") headers["X-Kit-Token"] = KIT_TOKEN;
  const response = await fetch(path, { ...(options || {}), headers });
  const data = await response.json();
  if (!response.ok) throw new Error(data.error || response.statusText);
  return data;
}

function visibleSkills() {
  const q = state.query.trim().toLowerCase();
  return state.skills.filter((skill) => {
    if (state.filter !== "all" && skill.category !== state.filter) return false;
    if (!q) return true;
    const blob = `${skill.name} ${skill.summary || ""} ${skill.excerpt || ""}`.toLowerCase();
    return blob.includes(q);
  });
}

function renderCats() {
  const total = state.skills.length;
  const filled = state.categories.filter((cat) => cat.count > 0);
  // 「其他 / 未分类」提到第二位：它是最大的一块待归档，别再埋在最底下
  const messy = filled.filter((cat) => /^(其他|未分类|other|uncategorized)$/i.test(String(cat.label || cat.id || "").trim()));
  const tidy = filled.filter((cat) => !messy.includes(cat));
  const items = [{ id: "all", label: "全部", count: total }, ...messy, ...tidy];
  catsEl.innerHTML = items.map((cat) => `
    <button class="cat ${state.filter === cat.id ? "active" : ""}" data-cat="${esc(cat.id)}" type="button">
      <span>${esc(cat.label)}</span><em>${cat.count}</em>
    </button>`).join("");
}

function renderList() {
  const rows = visibleSkills();
  listEl.innerHTML = rows.map((skill) => `
    <button class="skill ${state.current && state.current.name === skill.name ? "active" : ""}" draggable="true" data-name="${esc(skill.name)}" type="button">
      <b>${esc(skill.name)}</b>
      <small class="sum">${esc(skill.summary || skill.excerpt || "")}</small>
      <small>${esc(skill.category)}${skill.changed ? '<em class="changed">已改</em>' : ""}</small>
    </button>`).join("") || `<div class="empty">这个分类里没有匹配的技能。</div>`;
}

function renderDetail() {
  const skill = state.current;
  if (!skill) return;
  const options = state.categories.map((cat) =>
    `<option value="${esc(cat.id)}" ${cat.id === skill.category ? "selected" : ""}>${esc(cat.label)}</option>`
  ).join("");
  const scripts = (skill.scripts || []).length
    ? skill.scripts.map((item) => `<code>${esc(item)}</code>`).join(" · ")
    : "这个技能没有自带 scripts/";
  const catLabel = (state.categories.find((item) => item.id === skill.category) || {}).label || skill.category;
  detailEl.innerHTML = `
    <div class="detail-head">
      <div>
        <h3>${esc(skill.name)}</h3>
        <p>${esc(skill.summary || "还没有摘要。保存带 description 的 frontmatter 后，这里会更新。")}</p>
      </div>
      <div class="meta">${esc(catLabel)}${skill.changed ? "<br>正文和旧文件不一致" : ""}</div>
    </div>
    <div class="tools">
      <select id="move-to">${options}</select>
      <button id="move" type="button">移动</button>
      <span class="status" id="status"></span>
      <button id="sync-one" type="button">同步</button>
      <button class="save" id="save" type="button">保存正文</button>
    </div>
    <textarea id="editor" spellcheck="false"></textarea>
    <div class="scripts">${scripts}</div>`;
  const editor = document.getElementById("editor");
  editor.value = skill.content || "";
  editor.addEventListener("input", () => { state.dirty = true; });
  document.getElementById("move").addEventListener("click", () => moveSkill(skill.name, document.getElementById("move-to").value));
  document.getElementById("save").addEventListener("click", saveSkill);
  document.getElementById("sync-one").addEventListener("click", () => openSyncCard(skill.name));
}

function renderTicket(result, error, waiting) {
  if (waiting) {
    ticketEl.innerHTML = `<div class="ticket-card ticket-wait">${esc(waiting)}</div>`;
    return;
  }
  if (error) {
    ticketEl.innerHTML = `<div class="ticket-error">${esc(error)}</div>`;
    return;
  }
  if (!result) { ticketEl.innerHTML = ""; return; }
  if (result.task) state.lastRoute = result;
  const probs = Object.entries(result.categoryProbabilities || {}).sort((a, b) => b[1] - a[1]).slice(0, 4);
  const bars = probs.map(([key, value]) => {
    const label = (result.gateLabels || {})[key] || (key === "think" ? "自主思考" : ((state.categories.find((cat) => cat.id === key) || {}).label || key));
    return `<div class="bar"><span>${esc(label)}</span><i><b style="width:${Math.round(value * 100)}%"></b></i><span>${Math.round(value * 100)}</span></div>`;
  }).join("");
  const think = Math.round(((result.methodProbabilities || {}).think || 0) * 100);
  const skillPct = Math.round(((result.methodProbabilities || {}).skill || 0) * 100);
  const kinds = new Set((result.skills || []).map((item) => item.kind || "skill"));
  const methodName = result.method === "think"
    ? "自主思考"
    : kinds.has("plugin") && kinds.has("skill")
      ? "调用技能和插件"
      : kinds.has("plugin")
        ? "调用插件"
        : "调用技能";
  const methodPick = `<div class="pick"><div class="k">做法</div><strong>${methodName}</strong><span>自己想 ${think} · 技能 ${skillPct}</span></div>`;
  if (result.method === "think") {
    ticketEl.innerHTML = `<div class="ticket-card">${methodPick}<p class="note">${esc(result.message || "")}</p></div>`;
    return;
  }
  const picks = (result.skills || []).map((skill) => {
    const prob = typeof skill.probability === "number" ? ` · ${Math.round(skill.probability * 100)}` : "";
    const title = skill.kind === "plugin"
      ? `<strong>${esc(skill.name)}</strong>`
      : `<button type="button" data-open="${esc(skill.name)}"><strong>${esc(skill.name)}</strong></button>`;
    const where = skill.kind === "plugin" && skill.host ? `${esc(skill.host)} · ` : "";
    return `<div class="pick">
      <div class="k">${skill.kind === "plugin" ? "插件" : "调用"}${prob}</div>
      ${title}
      <span>${where}${esc(skill.summary || "")}</span>
      <div class="pick-actions">
        <button type="button" data-swap="${esc(skill.name)}">换掉</button>
        <button type="button" data-drop-now="${esc(skill.name)}">去掉</button>
      </div>
    </div>`;
  }).join("");
  const remembered = result.remembered && result.remembered.task
    ? `<p class="note">沿用了你对「${esc(result.remembered.task)}」的调整。</p>`
    : "";
  const clipped = result.clipped
    ? `<p class="note">原句超过 2000 字，后面没参与选择。</p>`
    : "";
  const why = (result.reasons || []).slice(0, 8).map((item) => {
    const mark = item.kept ? "留下" : "没留";
    const pct = typeof item.probability === "number" ? " " + Math.round(item.probability * 100) : "";
    return `${esc(item.label || item.id)} ${mark}${pct} · ${esc(item.reason || "")}`;
  }).join("<br>");
  const whyLine = why ? `<p class="note">${why}</p>` : "";
  ticketEl.innerHTML = `<div class="ticket-card">${methodPick}<div class="pick"><div class="k">柜门</div><strong>${esc(result.label)}</strong><span>${esc(result.category)}</span></div>${picks}<button type="button" id="ticket-add">再加一个</button>${remembered}${clipped}${passedLine(result.passed)}${whyLine}<div class="bars">${bars}</div></div>`;
}

function passedLine(passed) {
  const items = passed || [];
  if (!items.length) return "";
  const text = items.map((item) => {
    const pct = typeof item.probability === "number" ? " " + Math.round(item.probability * 100) : "";
    return esc(item.name) + pct;
  }).join("、");
  return `<p class="passed">没带上：${text}</p>`;
}

async function openSkill(name) {
  if (state.dirty && !confirm("正文还没保存，仍要打开另一个技能吗？")) return;
  const skill = await api("/api/skill?name=" + encodeURIComponent(name));
  state.current = skill;
  state.dirty = false;
  state.filter = skill.category;
  renderCats();
  renderList();
  renderDetail();
  const row = listEl.querySelector(`[data-name="${CSS.escape(name)}"]`);
  if (row) row.scrollIntoView({ block: "nearest" });
}

async function moveSkill(name, category) {
  const status = document.getElementById("status");
  if (status) status.textContent = "正在移动…";
  await api("/api/move", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ name, category })
  });
  const skill = state.skills.find((item) => item.name === name);
  if (skill) skill.category = category;
  recount();
  if (state.current && state.current.name === name) state.current.category = category;
  renderCats();
  renderList();
  renderDetail();
  const next = document.getElementById("status");
  if (next) next.textContent = "已移到 " + category;
}

async function saveSkill() {
  const skill = state.current;
  const content = document.getElementById("editor").value;
  const status = document.getElementById("status");
  status.textContent = "正在保存…";
  const saved = await api("/api/save", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ name: skill.name, content })
  });
  skill.content = content;
  skill.changed = true;
  const listed = state.skills.find((item) => item.name === skill.name);
  if (listed) {
    listed.changed = true;
    if (saved.summary) listed.summary = saved.summary;
  }
  if (saved.summary) skill.summary = saved.summary;
  state.dirty = false;
  renderList();
  status.textContent = "已保存";
  renderDetail();
  document.getElementById("status").textContent = "已保存";
}

function recount() {
  const counts = {};
  for (const skill of state.skills) counts[skill.category] = (counts[skill.category] || 0) + 1;
  for (const cat of state.categories) cat.count = counts[cat.id] || 0;
  document.getElementById("count").textContent = "jev-decision · " + state.skills.length;
}

catsEl.addEventListener("click", (event) => {
  const button = event.target.closest("[data-cat]");
  if (!button) return;
  state.filter = button.dataset.cat;
  renderCats();
  renderList();
});

catsEl.addEventListener("dragover", (event) => {
  const button = event.target.closest("[data-cat]");
  if (!button || button.dataset.cat === "all") return;
  event.preventDefault();
  button.classList.add("over");
});
catsEl.addEventListener("dragleave", (event) => {
  const button = event.target.closest("[data-cat]");
  if (button) button.classList.remove("over");
});
catsEl.addEventListener("drop", async (event) => {
  const button = event.target.closest("[data-cat]");
  if (!button || button.dataset.cat === "all") return;
  event.preventDefault();
  button.classList.remove("over");
  const name = event.dataTransfer.getData("text/plain");
  if (name) await moveSkill(name, button.dataset.cat);
});

listEl.addEventListener("click", (event) => {
  const button = event.target.closest("[data-name]");
  if (button) openSkill(button.dataset.name).catch((error) => alert(error.message));
});
listEl.addEventListener("dragstart", (event) => {
  const button = event.target.closest("[data-name]");
  if (!button) return;
  event.dataTransfer.setData("text/plain", button.dataset.name);
});

document.getElementById("search").addEventListener("input", (event) => {
  state.query = event.target.value;
  renderList();
});

ticketEl.addEventListener("click", (event) => {
  const open = event.target.closest("[data-open]");
  const swap = event.target.closest("[data-swap]");
  const drop = event.target.closest("[data-drop-now]");
  const add = event.target.closest("#ticket-add");
  if (open) openSkill(open.dataset.open).catch((error) => alert(error.message));
  if (!state.lastRoute) return;
  const target = { task: state.lastRoute.task, category: state.lastRoute.category, from: "ticket" };
  if (swap) openAddCard({ ...target, replace: swap.dataset.swap });
  if (add) openAddCard(target);
  if (drop) saveTaskRule({ task: target.task, category: target.category, remove: drop.dataset.dropNow }).catch((error) => alert(error.message));
});

document.getElementById("route-form").addEventListener("submit", async (event) => {
  event.preventDefault();
  const button = document.getElementById("go");
  const task = document.getElementById("task").value.trim();
  if (!task) return;
  button.disabled = true;
  button.textContent = "在选";
  state.routeTask = task;
  let waiting = "正在用 jev-decision 打分，请等这一次完成，不要重复点。";
  try {
    const health = await api("/api/health");
    if (health.modelReady) waiting = "正在选择…";
  } catch (error) {
    waiting = "正在选择…";
  }
  renderTicket(null, null, waiting);
  try {
    const result = await api("/api/route", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ task })
    });
    result.task = result.task || task;
    renderTicket(result);
    if (result.category) {
      state.filter = result.category;
      renderCats();
      renderList();
    }
  } catch (error) {
    renderTicket(null, error.message);
  } finally {
    button.disabled = false;
    button.textContent = "选择";
  }
});

document.querySelectorAll(".views button").forEach((button) => {
  button.addEventListener("click", () => {
    document.querySelectorAll(".views button").forEach((item) => item.classList.toggle("on", item === button));
    const view = button.dataset.view;
    document.querySelector("main").classList.toggle("off", view !== "cabinet");
    document.getElementById("calls-view").classList.toggle("on", view === "calls");
    document.getElementById("delegation-view").classList.toggle("on", view === "delegation");
    document.getElementById("mcp-view").classList.toggle("on", view === "mcp");
    document.getElementById("plugin-view").classList.toggle("on", view === "plugins");
    document.getElementById("settings-view").classList.toggle("on", view === "settings");
    document.getElementById("library-view").classList.toggle("on", view === "library");
    if (view === "calls") loadCalls().catch((error) => alert(error.message));
    if (view === "delegation") loadDelegation().catch((error) => alert(error.message));
    if (view === "mcp") loadMcp().catch((error) => alert(error.message));
    if (view === "plugins") loadPlugins(true).catch((error) => alert(error.message));
    if (view === "settings") loadSettings().catch((error) => alert(error.message));
    if (view === "library") loadLibrary().catch((error) => alert(error.message));
  });
});

    <tr>
      <td data-label="宿主">${esc(item.host)}</td>
      <td data-label="服务">${esc(item.name)}</td>

      <h2>MCP</h2>

      ["local", "本地目录", "D:\\mcp\\my-server"]
    ],
    path: "/api/mcp/add",

  }));
}

function toolCells(kind, item) {
  const on = item.enabled ? " on" : "";
  const pressed = item.enabled ? "true" : "false";
  const word = item.enabled ? "开" : "关";
  return `<td data-label="操作"><span class="row-tools">
      <button class="switch${on}" type="button" role="switch" data-toggle="${kind}" data-host="${esc(item.host)}" data-name="${esc(item.name)}" data-enabled="${item.enabled ? "1" : "0"}" aria-pressed="${pressed}" aria-label="${word === "开" ? "关闭" : "开启"} ${esc(item.name)}"><i></i></button><span class="switch-text${on}">${word}</span>
      <button type="button" data-remove="${kind}" data-host="${esc(item.host)}" data-name="${esc(item.name)}">删除</button>
    </span></td>`;
}

async function pollJob(kind, job, onTick) {
  let current = job;
  onTick(current);
  while (current && current.state === "running") {
    await new Promise((resolve) => setTimeout(resolve, 700));
    current = await api("/api/progress?kind=" + encodeURIComponent(kind) + "&id=" + encodeURIComponent(job.id));
    onTick(current);
  }
  return current;
}

function jobStatusText(job) {
  if (!job) return "";
  if (job.state === "failed") return job.message || job.label || "没做完";
  if (job.state === "done") return "完成。" + (job.message || job.label || "");
  return job.message || job.label || "";
}

function paintTrack(prefix, job) {
  const line = document.getElementById(prefix + "-status");
  const track = document.getElementById(prefix + "-track");
  const bar = track && track.querySelector("span");
  if (line) line.textContent = jobStatusText(job);
  if (track) {
    track.hidden = !job || job.state === "done";
    track.classList.toggle("failed", !!(job && job.state === "failed"));
  }
  if (bar) bar.style.width = job && job.state === "done" ? "0%" : Math.max(0, Math.min(100, Number((job && job.progress) || 0))) + "%";
}

function renderPluginTable(data, job) {
  const rows = (data.plugins || []).map((item) => `
    <tr>
      <td data-label="宿主">${esc(item.host)}</td>
      <td data-label="插件">${esc(item.name)}</td>
      <td data-label="jev-decision">${item.selectable ? "会选" : "不选"}</td>
      ${toolCells("plugin", item)}
    </tr>`).join("");
  const progress = job || state.pluginJob;
  document.getElementById("plugin-view").innerHTML = `
    <div class="calls-head">
      <h2>插件</h2>
      <button id="add-plugin" type="button">添加插件</button>
      <button id="refresh-plugins" type="button">重新读取</button>
    </div>
    <p class="note">${esc(data.note || "")} 开关和删除只改技能柜里的这份名单，不改宿主原来的文件。关掉之后 jev-decision 不再选它。</p>
    <p class="note" id="plugin-status">${esc(jobStatusText(progress))}</p>
    <div class="install-track${progress && progress.state === "failed" ? " failed" : ""}" id="plugin-track" ${progress && progress.state !== "done" ? "" : "hidden"}><span style="width:${progress && progress.state === "done" ? 0 : Number((progress && progress.progress) || 0)}%"></span></div>
    <table>
      <thead><tr><th>宿主</th><th>插件</th><th>jev-decision</th><th>操作</th></tr></thead>
      <tbody>${rows || "<tr><td colspan=\"4\">没有读到插件。</td></tr>"}</tbody>
    </table>`;

function effortLabel(value) {
  const raw = String(value || "").trim();
  const map = { none: "无", minimal: "最低", low: "低", medium: "中", high: "高", xhigh: "很高", max: "最高", ultra: "极限" };
  const zh = map[raw.toLowerCase()];
  if (zh) return zh + "（" + raw + "）";
  return raw || "—";
}

function openDispatch(kind, key) {
  const pack = state.delegation || {};
  const row = kind === "run"
    ? (pack.runs || []).find((item) => item.id === key)

  document.getElementById("drawer-body").innerHTML = `
    <div><h4>${isRun ? "这次子代理" : "这次建议"}</h4><p class="q">${esc(row.task || "（没有任务原文）")}</p></div>

async function loadDelegation() {
  const data = await api("/api/delegation");
  const entries = data.entries || [];
  const plans = entries.filter((entry) => entry.kind !== "observed");
  const observed = entries.filter((entry) => entry.kind === "observed");

  // 观测行按 childId 配对「创建 → 结束」，顺带算出耗时
  const runs = new Map();
  for (const entry of observed) {
    const id = entry.childId || "(没有 id)";
    if (!runs.has(id)) runs.set(id, { id, source: entry.source, task: entry.task || "", start: null, end: null, state: entry.state, model: "", effort: "", detail: "" });
    const run = runs.get(id);
    if (entry.model) run.model = entry.model;
    if (entry.effort) run.effort = entry.effort;
    if (entry.state === "started") { run.start = entry.at; run.state = "started"; }
    else { run.end = entry.at; run.state = entry.state; }
    if (entry.detail) run.detail = entry.detail;
    if (!run.task && entry.task) run.task = entry.task;
    if (!run.source && entry.source) run.source = entry.source;
  }
  function duration(run) {
    if (!run.start || !run.end) return "";
    const ms = new Date(run.end) - new Date(run.start);
    if (!Number.isFinite(ms) || ms < 0) return "";
    return ms < 1000 ? ms + "ms" : (ms / 1000).toFixed(1) + "s";
  }
  const stateText = { started: "创建中", completed: "已完成", error: "失败", aborted: "已中止" };
  const stateClass = { started: "warn", completed: "ok", error: "err", aborted: "muted" };
  const planList = plans.map((entry) => {
    const advice = entry.kind === "effort-decision"
      ? `建议强度 ${effortLabel(entry.effort)}`
      : (entry.recommendation === "delegate" ? `建议派 ${entry.agents == null ? "?" : entry.agents} 个` : "单代理");
    return { ...entry, advice };
  });
  const runList = Array.from(runs.values()).map((run) => ({
    ...run,
    duration: duration(run),
    stateText: stateText[run.state] || run.state || "",
  }));
  state.delegation = { plans: planList, runs: runList };

  const planRows = planList.map((entry, index) => {
    const tone = entry.kind !== "effort-decision" && entry.recommendation === "delegate" ? "ok" : "muted";
    return `<tr class="row-click" data-dispatch-plan="${index}">
      <td data-label="时间" class="mono">${esc(formatWhen(entry.at))}</td>
      <td data-label="宿主">${esc(entry.source)}</td>
      <td data-label="建议"><span class="pill ${tone}">${esc(entry.advice)}</span></td>
      <td data-label="模型">${esc(entry.model || "—")}</td>
      <td data-label="思考程度">${esc(effortLabel(entry.effort))}</td>
      ${clipTd("任务", entry.task)}
      ${clipTd("详情", entry.detail || entry.reason || "")}
    </tr>`;
  }).join("") || `<tr><td colspan="7" class="muted-cell">还没有派遣建议。</td></tr>`;

  const runRows = runList.map((run) => `<tr class="row-click" data-dispatch-run="${esc(run.id)}">
      <td data-label="开始" class="mono">${esc(formatWhen(run.start || run.end || ""))}</td>
      <td data-label="宿主">${esc(run.source)}</td>
      <td data-label="状态"><span class="pill ${stateClass[run.state] || "muted"}">${esc(run.stateText)}</span></td>
      <td data-label="模型">${esc(run.model || "—")}</td>
      <td data-label="思考程度">${esc(effortLabel(run.effort))}</td>
      <td data-label="耗时">${esc(run.duration)}</td>
      ${clipTd("详情", run.detail || run.task || "")}
    </tr>`).join("")
    || `<tr><td colspan="7" class="muted-cell">还没有观测到真实子代理。宿主拉起子代理后，这里会按 run 自动配对「创建 → 结束」，并带上模型、思考程度和详情。</td></tr>`;

  document.getElementById("delegation-view").innerHTML = `
    <div class="calls-head"><h2>子代理派遣</h2><button id="refresh-delegation" type="button">刷新日志</button></div>
    <label><input id="delegation-enabled" type="checkbox" ${data.enabled ? "checked" : ""}> 启用派遣判断</label>
    <p class="note">任务和详情只显示一行。点这一行，右边弹出全文、模型、思考程度。</p>
    <p class="note" id="delegation-status"></p>
    <h3 class="group">建议（jev-decision 的判断，不一定真的派了）<span class="count">${plans.length}</span></h3>
    <table><thead><tr><th>时间</th><th>宿主</th><th>建议</th><th>模型</th><th>思考程度</th><th>任务</th><th>详情</th></tr></thead><tbody>${planRows}</tbody></table>
    <h3 class="group">真实子代理（宿主观测，按 run 配对）<span class="count">${runList.length}</span></h3>
    <table><thead><tr><th>开始</th><th>宿主</th><th>状态</th><th>模型</th><th>思考程度</th><th>耗时</th><th>详情</th></tr></thead><tbody>${runRows}</tbody></table>`;
  document.getElementById("refresh-delegation").addEventListener("click", () => loadDelegation().catch((error) => alert(error.message)));
  document.getElementById("delegation-view").onclick = (event) => {
    if (event.target.closest("button, input, label")) return;
    const plan = event.target.closest("[data-dispatch-plan]");
    if (plan) { openDispatch("plan", plan.dataset.dispatchPlan); return; }
    const run = event.target.closest("[data-dispatch-run]");
    if (run) openDispatch("run", run.dataset.dispatchRun);
  };
  document.getElementById("delegation-enabled").addEventListener("change", async (event) => {
    const box = event.target;
    const status = document.getElementById("delegation-status");
    box.disabled = true;
    try {
      await api("/api/settings", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ delegationEnabled: box.checked }) });
      status.textContent = box.checked ? "派遣判断已开启。" : "派遣判断已关闭。";
    } catch (error) {
      box.checked = !box.checked;
      status.textContent = error.message;
    } finally { box.disabled = false; }
  });
}

async function loadCalls() {
  const data = await api("/api/calls");
  state.calls = data.calls || [];
  state.taskRules = Array.isArray(data.rules) ? data.rules : [];
  const rules = state.taskRules.map((rule, index) => {
    const added = (rule.add || []).map((name) => `<span class="chip">${esc(name)} <button type="button" data-rule-act="unadd" data-rule="${index}" data-skill="${esc(name)}">去掉</button></span>`).join("");
    const removed = (rule.remove || []).map((name) => `<span class="chip">${esc(name)} <button type="button" data-rule-act="unremove" data-rule="${index}" data-skill="${esc(name)}">恢复</button></span>`).join("");
    return `<p>「${esc(rule.task)}」下次跳过：${removed || "无"}。下次带上：${added || "无"}。</p>`;
  }).join("") || "<p class=\"note\">还没有按某句话记住的调整。</p>";
  const rows = state.calls.map((call) => {
    const thinking = call.method === "think";
    const forget = `<button type="button" data-forget="${esc(call.id)}">删掉记录</button>`;
    const names = call.skills || [];
    const skills = thinking
      ? `<div class="skill-line"><span class="skill-name">没有调用技能</span><span></span><span></span>${forget}</div>`
      : (names.length ? names : [""]).map((name, index) => `<div class="skill-line"><span class="skill-name">${esc(name)}</span>${name ? `<button type="button" data-drop-call="${esc(call.id)}" data-skill="${esc(name)}">删除</button>` : "<span></span>"}${index === 0 ? `<button class="chip-add" type="button" data-open-add="${esc(call.id)}">添加</button>${forget}` : "<span></span><span></span>"}</div>`).join("") + passedLine(call.passed);
    return `<tr class="row-click" data-call="${esc(call.id)}">
      <td data-label="时间">${esc(formatWhen(call.at))}<br>${esc(call.sourceLabel || call.source || "")}</td>
      ${clipTd("任务", call.task)}
      <td data-label="做法">${thinking ? "自主思考" : "调用技能"}</td>
      <td data-label="类型">${esc(call.label || call.category || "")}</td>
      <td data-label="调用的技能">${skills}</td>
    </tr>`;
  }).join("") || `<tr><td colspan="5">还没有调用记录。</td></tr>`;
  state.mcpText = (data.mcp || {}).configText || "";
  document.getElementById("calls-view").innerHTML = `
    <div class="calls-head">
      <h2>调用记录</h2>
      <button id="open-mcp" type="button">接入教程</button>
    </div>
    <p class="note">任务只显示一行，点这一行右边弹出这次决定的全文和判定依据。「删除」和「添加」只记住这一句话，以及以后很像的说法。点「删掉记录」只去掉这一行。选了自主思考的那次不套技能。</p>
    ${rules}
    <table><thead><tr><th>时间</th><th>任务</th><th>做法</th><th>类型</th><th>调用的技能</th></tr></thead><tbody>${rows}</tbody></table>`;
  document.getElementById("open-mcp").addEventListener("click", openMcpCard);
}

document.getElementById("calls-view").addEventListener("click", async (event) => {
  const drop = event.target.closest("[data-drop-call]");
  const openAdd = event.target.closest("[data-open-add]");
  const forget = event.target.closest("[data-forget]");
  const ruleBtn = event.target.closest("[data-rule-act]");
  try {
    if (forget) {
      await api("/api/calls/delete", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ id: forget.dataset.forget }) });
      await loadCalls();
      return;
    }
    if (drop) {
      const call = (state.calls || []).find((item) => item.id === drop.dataset.dropCall);
      if (!call) return;
      await saveTaskRule({ task: call.task, category: call.category, remove: drop.dataset.skill });
      await loadCalls();
      return;
    }
    if (ruleBtn) {
      const rule = (state.taskRules || [])[Number(ruleBtn.dataset.rule)];
      if (!rule) return;
      const body = { task: rule.task, category: rule.category };
      body[ruleBtn.dataset.ruleAct] = ruleBtn.dataset.skill;
      await saveTaskRule(body);
      await loadCalls();
      return;
    }
    if (openAdd) {
      const call = (state.calls || []).find((item) => item.id === openAdd.dataset.openAdd);
      if (!call || call.method === "think") return;
      openAddCard({ task: call.task, category: call.category, from: "calls" });
    }
    // 点这一行的空白处 → 打开「这次决定」详情抽屉
    const row = event.target.closest("tr[data-call]");
    if (row) openDecision(row.dataset.call);
  } catch (error) {
    alert(error.message);
  }
});

async function addSkillRoot(path) {
  const folder = (path || "").trim();
  if (!folder) return;
  const status = document.getElementById("settings-status");
  status.textContent = "正在从该文件夹复制技能，原目录不会删。";
  const report = await api("/api/folders", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ path: folder }) });
  const catalog = await api("/api/catalog");
  applyCatalog(catalog, status, report);
  await loadSettings();
  document.getElementById("settings-status").textContent = `已加入。新复制 ${report.copied.length} 个，重复跳过 ${report.skippedDuplicates} 个。`;
}

async function pickSkillRoot() {
  const status = document.getElementById("settings-status");
  status.textContent = "请在弹出的窗口里选择技能文件夹。";
  const report = await api("/api/folders/pick", { method: "POST", headers: { "Content-Type": "application/json" }, body: "{}" });

  await loadSettings();

async function removeSkillRoot(path) {
